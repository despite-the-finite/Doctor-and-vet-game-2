<title>Little Heroes Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
/* ── base.css ─────────────────────────────── */
/* ==========================================================================
   Little Heroes Hospital — reset, layout primitives & shared motion
   Every colour, font, radius and shadow now lives in tokens.css, which is
   loaded first. This file carries only the things a token cannot express:
   the reset, the screen shell, the fluid sizing ramp, and the motion this
   game needs on top of the design's library.
   ========================================================================== */

:root {
  /* The design fixes a 1280x800 stage; the game also has to hold up on a
     phone. Each step is a clamp between the design's label floor and the
     design's size for that role, so nothing ever renders below 14px. */
  --step-0: clamp(var(--lh-size-label), 0.6vw + 12px, var(--lh-size-body));
  --step-1: clamp(var(--lh-size-body), 1.1vw + 13px, var(--lh-size-body-lg));
  --step-2: clamp(21px, 2.2vw + 12px, var(--lh-size-h3));
  --step-3: clamp(28px, 3.4vw + 14px, var(--lh-size-h1));
  --step-4: clamp(36px, 6.4vw + 12px, var(--lh-size-hero));

  --safe: env(safe-area-inset-bottom, 0px);

  /* The game commits to one bright, sunny world rather than following the
     host's theme. Declaring the scheme keeps built-in controls — the
     microscope's focus dial, chiefly — light to match, wherever it is
     embedded. Every colour is painted explicitly for the same reason. */
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  min-height: 100dvh;   /* holds up when embedded in someone else's document */
  overscroll-behavior: none;
}

/* tokens.css already sets the family, weight, colour and ground. */
body {
  font-size: var(--step-0);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}

h1, h2, h3, h4, .lh-display {
  font-family: var(--lh-font-display);
  font-weight: 800;
  letter-spacing: .2px;
  margin: 0;
  line-height: var(--lh-lh-tight);
}

p { text-wrap: pretty; }

button { font-family: inherit; }

#app {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 900;
  overflow: hidden;
}

/* Every screen fills the viewport and scrolls internally, so a child can
   never end up on a page with no way back. */
.lh-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: lh-screen-in .38s cubic-bezier(.2,.9,.3,1.15) both;
}

.lh-screen__scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(24px + var(--safe));
}

@keyframes lh-screen-in {
  from { opacity: 0; transform: translateY(18px) scale(.985); }
  to   { opacity: 1; transform: none; }
}

/* --- motion this game needs on top of the design's library --------------- */
/* tokens.css owns lh-bob, lh-breathe, lh-sway, lh-blink, lh-wag, lh-twinkle,
   lh-drift, lh-pulse, lh-pop, lh-shine, lh-rise, lh-spin and lh-letter. */
@keyframes lh-bob-slow  { 0%,100% { transform: translateY(0) }   50% { transform: translateY(-5px) } }
@keyframes lh-wiggle    { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) } }
@keyframes lh-glow-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(255,216,77,.85) } 50% { box-shadow: 0 0 0 16px rgba(255,216,77,0) } }

/* The design's lh-drift moves a prop across its own box; scenery that
   crosses the whole scene — clouds, birds, the helicopter — uses this. */
@keyframes lh-drift-vw  { from { transform: translateX(-20vw) } to { transform: translateX(120vw) } }

/* The sun's halo breathing. */
@keyframes lh-halo      { 0%,100% { opacity: .5 } 50% { opacity: 1 } }

/* A vehicle that pulls up, waits, and is gone again. */
@keyframes lh-drive-in  { 0% { transform: translateX(-60%) } 22%, 100% { transform: translateX(0) } }

.lh-bob { animation: lh-bob 2.6s ease-in-out infinite; }

/* Respect reduced-motion: keep the game readable, drop the ambience.
   tokens.css stills the animations; transitions are this file's to calm. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .05s !important; }
}

/* Utility */
.lh-center { display: flex; align-items: center; justify-content: center; }
.lh-col { display: flex; flex-direction: column; }
.lh-row { display: flex; align-items: center; }
.lh-gap-s { gap: 8px } .lh-gap-m { gap: 16px } .lh-gap-l { gap: 26px }
.lh-wrap { flex-wrap: wrap; }
.lh-hidden { display: none !important; }
.lh-sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}


/* ── ui.css ─────────────────────────────── */
/* ==========================================================================
   Little Heroes Hospital — component layer
   The design's kit, plus the parts of this game the kit does not cover
   (modal, toast, speech bubble, particles, character artwork), written in
   the same idiom. Requires tokens.css first. Every value here is lifted
   from the design references; where a number looks arbitrary it is
   deliberate — see the reference file.
   ========================================================================== */

/* ---------- 1. Buttons: physical objects with an edge you press ---------- */
.lh-btn {
  border: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--lh-font-display); font-weight: 800;
  border-radius: var(--lh-r-pill);
  min-height: var(--lh-tap-min);
  padding: 18px 34px;
  font-size: var(--lh-size-btn);
  user-select: none;
  transition: transform .12s cubic-bezier(.2,1.4,.4,1), box-shadow .12s ease;
}
/* the press: the object travels down onto its own edge */
.lh-btn:active { transform: translateY(5px); }
.lh-btn:focus-visible { outline: 4px solid var(--lh-ink); outline-offset: 4px; }
.lh-btn[disabled] { filter: grayscale(.7) opacity(.65); pointer-events: none; }

.lh-btn--primary {                        /* teal, the go-forward action */
  padding: 22px 44px; font-size: var(--lh-size-btn-lg);
  background: linear-gradient(180deg, var(--lh-doc-lite), var(--lh-doc));
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.14);
  box-shadow: 0 8px 0 var(--lh-doc-deep), var(--lh-air-3), var(--lh-gloss);
}
.lh-btn--primary:active { box-shadow: 0 3px 0 var(--lh-doc-deep), var(--lh-air-1), var(--lh-gloss); }

.lh-btn--secondary {                      /* marigold, the carry-on action */
  background: linear-gradient(180deg, var(--lh-marigold-lite), var(--lh-marigold));
  color: var(--lh-marigold-ink);
  box-shadow: 0 7px 0 var(--lh-marigold-deep), 0 14px 24px rgba(46,42,68,.18), inset 0 3px 0 rgba(255,255,255,.55);
}
.lh-btn--secondary:active { box-shadow: 0 2px 0 var(--lh-marigold-deep), var(--lh-air-1), var(--lh-gloss); }

.lh-btn--quiet {                          /* white, the decline / back action */
  background: var(--lh-panel); color: var(--lh-ink-body);
  box-shadow: 0 7px 0 rgba(46,42,68,.16), 0 14px 22px rgba(46,42,68,.14);
}
.lh-btn--quiet:active { box-shadow: 0 2px 0 rgba(46,42,68,.16), var(--lh-air-1); }

.lh-btn--icon {                           /* audio, settings, back */
  width: var(--lh-icon-btn); height: var(--lh-icon-btn);
  padding: 0; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--lh-panel);
  font-size: 30px; line-height: 1;
  box-shadow: 0 6px 0 rgba(46,42,68,.16), 0 12px 20px rgba(46,42,68,.14);
}
/* icons inside are 30px strokes of --lh-ink-body at 3.4–5px, round caps */
.lh-btn--icon:active { box-shadow: 0 2px 0 rgba(46,42,68,.16), var(--lh-air-1); }

/* Two more faces this game needs: the raspberry "start over" and the toy
   world's grape. Both take a tinted edge, never a grey one. */
.lh-btn--alert {
  background: linear-gradient(180deg, var(--lh-rasp), var(--lh-rasp-deep));
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.14);
  box-shadow: 0 7px 0 var(--lh-rasp-deep), var(--lh-air-2), var(--lh-gloss);
}
.lh-btn--alert:active { box-shadow: 0 2px 0 var(--lh-rasp-deep), var(--lh-air-1), var(--lh-gloss); }
.lh-btn--toy {
  background: linear-gradient(180deg, var(--lh-toy-lite), var(--lh-toy));
  color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.14);
  box-shadow: 0 7px 0 var(--lh-toy-deep), var(--lh-air-2), var(--lh-gloss);
}
.lh-btn--toy:active { box-shadow: 0 2px 0 var(--lh-toy-deep), var(--lh-air-1), var(--lh-gloss); }

/* sizes */
.lh-btn--lg { padding: 24px 56px; font-size: var(--lh-size-btn-lg); }
.lh-btn--sm { min-height: var(--lh-tap-min); padding: 12px 22px; font-size: var(--lh-size-body); }
.lh-btn--wide { width: min(520px, 92%); }

/* ---------- 2. HUD: floating pills over the world, never a bar ---------- */
.lh-hud {
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding: 14px 16px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  z-index: 40; flex: none;
}
.lh-hud__spacer { flex: 1; }
.lh-hud__title {
  font-family: var(--lh-font-display); font-weight: 800;
  font-size: var(--lh-size-h3); color: var(--lh-paper);
  text-shadow: 0 3px 0 rgba(31,94,104,.4); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.lh-hud--dark .lh-hud__title { color: var(--lh-ink); text-shadow: 0 2px 0 rgba(255,255,255,.6); }

.lh-chip {
  display: inline-flex; align-items: center; gap: 10px;
  height: var(--lh-hud-h); padding: 0 20px 0 12px;
  border-radius: var(--lh-r-pill); background: var(--lh-panel);
  box-shadow: 0 5px 0 rgba(46,42,68,.14), var(--lh-air-1);
  color: var(--lh-ink); white-space: nowrap;
}
.lh-chip__num { font-family: var(--lh-font-display); font-weight: 800; font-size: var(--lh-size-hud-num); }
.lh-chip__icon { width: 30px; height: 30px; font-size: 26px; line-height: 1; display: grid; place-items: center; }
/* on award: animate lh-pop on the chip, then count the number up */
.is-bumping { animation: lh-pop .55s cubic-bezier(.2,1.5,.4,1); }

/* On a phone the bar takes two rows so the title is never squeezed out. */
@media (max-width: 620px) {
  .lh-hud { row-gap: 8px; gap: 10px; }
  .lh-hud__title { font-size: var(--lh-size-card-title); flex: 1 1 0; min-width: 0; }
  .lh-hud__spacer { flex: 0 0 0px; }
  .lh-hud > .lh-btn--icon { flex: none; width: var(--lh-tap-min); height: var(--lh-tap-min); font-size: 26px; }
  .lh-chip { height: 48px; padding: 0 14px 0 10px; }
  .lh-chip__num { font-size: var(--lh-size-body-lg); }

  .lh-hud--chips > .lh-btn--icon        { order: 2; }
  .lh-hud--chips > [data-role='back']    { order: 0; }
  .lh-hud--chips > .lh-hud__title       { order: 1; margin-right: auto; }
  .lh-hud--chips > .lh-hud__spacer      { order: 3; flex: 1 0 100%; height: 0; }
  .lh-hud--chips > .lh-chip             { order: 4; }
}

.lh-meter { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 14px; }
.lh-meter__track {
  flex: 1; height: 22px; border-radius: var(--lh-r-pill);
  background: rgba(46,42,68,.12);
  box-shadow: inset 0 3px 5px rgba(46,42,68,.16);
  overflow: hidden;
}
.lh-meter__fill {
  height: 100%; border-radius: var(--lh-r-pill);
  background: linear-gradient(90deg, var(--lh-vet), var(--lh-star));
  background-size: 200% 100%;
  animation: lh-shine 2.6s linear infinite;
  transition: width .6s cubic-bezier(.2,.9,.3,1);
}
.lh-meter__label { font-family: var(--lh-font-display); font-weight: 800; font-size: 20px; color: var(--lh-ink-soft); }

/* ---------- 3. Case card / level tile ---------- */
.lh-case {
  position: relative; display: flex; gap: 16px; align-items: center;
  padding: 20px; border-radius: var(--lh-r-xl);
  border: none; text-align: left; color: var(--lh-ink); font: inherit;
  background: var(--lh-panel);
  box-shadow: 0 8px 0 #E7DFD2, var(--lh-air-2);
  cursor: pointer;
  transition: transform .16s cubic-bezier(.2,1.4,.4,1);
}
.lh-case:hover { transform: translateY(-4px); }
.lh-case__art {                            /* the drawn patient/scene thumb */
  flex: none; width: 76px; height: 76px; border-radius: var(--lh-r-md);
  display: grid; place-items: center;
  background: linear-gradient(180deg, var(--lh-accent-tint), var(--lh-doc-mist-2));
  box-shadow: inset 0 -4px 0 rgba(31,94,104,.12);
  overflow: hidden;
  animation: lh-bob 3s ease-in-out infinite;
}
/* The thumb shows the case's own drawn patient, cropped to the face. */
.lh-case__art svg { width: 185%; height: auto; display: block; transform: translateY(9%); }
.lh-case__art > svg[viewBox='0 0 40 40'] { width: 44%; transform: none; }
.lh-case__go { display: grid; place-items: center; width: 44px; height: 44px;
  border-radius: 50%; background: var(--lh-star); box-shadow: 0 4px 0 var(--lh-star-deep); }
.lh-case__done { flex: none; font-size: var(--lh-size-meta); font-weight: 800; color: #7A7599; }
.lh-case__state { flex-direction: column; gap: 4px; }
.lh-case__body { flex: 1; min-width: 0; }
.lh-case__title { font-family: var(--lh-font-display); font-weight: 800; font-size: var(--lh-size-card-title); line-height: 1.1; }
.lh-case__tagline { font-size: var(--lh-size-meta); font-weight: 700; color: #7A7599; margin-top: 4px; }
.lh-case__teaches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.lh-case__tag {                            /* topic chips */
  padding: 4px 12px; border-radius: var(--lh-r-pill);
  background: #EFEAFB; color: #6B5FA8; font-size: 13px; font-weight: 800;
}
.lh-case__flag {                           /* the PLAY NEXT ribbon */
  position: absolute; left: 20px; top: -13px;
  padding: 5px 14px; border-radius: var(--lh-r-pill);
  background: var(--lh-rasp); color: var(--lh-paper);
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--lh-size-label); letter-spacing: .6px;
  box-shadow: 0 4px 0 var(--lh-rasp-deep);
}
.lh-case__state { flex: none; display: grid; place-items: center; font-size: 30px; line-height: 1; }
.lh-case--next { background: linear-gradient(180deg,#FFFDF6,#FFF4DC); box-shadow: 0 8px 0 #E8C86A, 0 18px 28px rgba(46,42,68,.16); }
.lh-case--done { background: linear-gradient(180deg,#FFFFFF,#F2FBF5); box-shadow: 0 8px 0 #D9E9DE, var(--lh-air-2); }
.lh-case--locked {
  background: var(--lh-sunk); box-shadow: var(--lh-inset);
  cursor: default; opacity: .9;
}
.lh-case--locked .lh-case__art { background: var(--lh-locked-fill); animation: none; }
.lh-case--locked .lh-case__title { color: var(--lh-ink-mute); }
.lh-case--locked .lh-case__tagline { color: var(--lh-ink-faint); }
/* locked copy is always the requirement, never a scold:
   "Finish Doctor Level 7", "Buy it in the Supply Room" */

/* ---------- 4. Panels ---------- */
.lh-panel {
  padding: 26px; border-radius: var(--lh-r-2xl);
  background: var(--lh-panel); box-shadow: var(--lh-edge-4);
}
.lh-panel--float { background: rgba(255,255,255,.94); box-shadow: 0 9px 0 rgba(46,42,68,.14); }
.lh-panel--dark  { background: var(--lh-ink); color: var(--lh-paper); }
.lh-panel--dark p, .lh-panel--dark .lh-body { color: #C9C4E0; }

/* The game's plain card is a panel with a lighter edge. */
.lh-card {
  background: var(--lh-panel);
  border-radius: var(--lh-r-xl);
  box-shadow: var(--lh-edge-2), var(--lh-air-2);
  padding: 20px;
}

/* ---------- 5. Option swatches (character creator) ---------- */
.lh-swatch {
  width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
  border: none; padding: 0;
  box-shadow: 0 4px 0 rgba(46,42,68,.20);
}
.lh-swatch--lg { width: 52px; height: 52px; }
.lh-swatch--square { border-radius: var(--lh-r-xs); }
.lh-swatch--rainbow { background: linear-gradient(120deg, var(--lh-rasp), var(--lh-star), var(--lh-vet), var(--lh-sky), var(--lh-toy)); }
.lh-swatch[aria-pressed='true'] { box-shadow: 0 4px 0 rgba(46,42,68,.20), 0 0 0 5px var(--lh-accent, var(--lh-doc)); }
.lh-pillopt {
  padding: 12px 20px; border-radius: var(--lh-r-sm); cursor: pointer;
  border: none;
  background: #F1EDE4; color: var(--lh-ink-soft);
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--lh-size-body);
}
.lh-pillopt[aria-pressed='true'] { background: var(--lh-accent, var(--lh-doc)); color: var(--lh-paper); }
.lh-optgroup { padding: 16px 18px; border-radius: var(--lh-r-lg); background: var(--lh-panel); box-shadow: 0 7px 0 #E4DFD4; }
.lh-optgroup__label { font-family: var(--lh-font-display); font-weight: 800; font-size: 19px; margin-bottom: 12px; }
.lh-optgroup__row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- 6. Scene layers: every screen is four stacked planes ---------- */
.lh-scene { position: relative; overflow: hidden; background: var(--lh-sky-grad); }
.lh-scene__sky, .lh-scene__far, .lh-scene__room, .lh-scene__fore { position: absolute; inset: 0; }
.lh-scene__far  { filter: saturate(.88); opacity: .96; }   /* depth haze */
.lh-scene__grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: multiply; }
/* Warm key light from above left, cool shade rising from the ground. */
.lh-scene__light {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,224,138,.22) 0%, rgba(255,255,255,0) 46%),
              linear-gradient(0deg, rgba(46,42,68,.14) 0%, rgba(255,255,255,0) 55%);
}
.lh-scene__vignette {
  position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 180px 60px rgba(46,42,68,.10);
}
/* Hills/canopies are half-ellipses:
   border-radius: 50% 50% 0 0 / 100% 100% 0 0
   Rooms and scenery are big soft organic shapes; rectangles only
   appear inside furniture. */

/* ---------- 7. Reward ---------- */
.lh-star-stamp { animation: lh-pop .8s ease both; }
.lh-star-stamp:nth-child(2) { animation-delay: .16s; }
.lh-star-stamp:nth-child(3) { animation-delay: .32s; }
.lh-readout { animation: lh-rise 1.1s ease forwards; }   /* floating +1 / value */
.lh-hotspot { border-radius: 50%; background: rgba(255,216,77,.55); animation: lh-pulse 2.6s ease-out infinite; }

/* ==========================================================================
   Parts the design kit does not name, in the same language.
   ========================================================================== */

/* ---------- modal ---------- */
.lh-modal__veil {
  position: fixed; inset: 0; z-index: 800;
  background: rgba(46,42,68,.55);
  backdrop-filter: blur(6px);
  display: grid; place-items: center;
  padding: 20px;
  animation: lh-veil-in .25s ease both;
}
@keyframes lh-veil-in { from { opacity: 0 } to { opacity: 1 } }
.lh-modal {
  width: min(560px, 100%);
  max-height: 88vh; overflow-y: auto;
  background: var(--lh-panel);
  border-radius: var(--lh-r-2xl);
  box-shadow: var(--lh-edge-4), var(--lh-air-3);
  padding: 30px 26px calc(26px + var(--safe));
  text-align: center;
  animation: lh-pop .42s cubic-bezier(.2,1.3,.4,1.1) both;
}
.lh-modal h2 { font-size: var(--lh-size-h3); margin-bottom: 8px; }
.lh-modal p  { font-size: var(--lh-size-body-lg); color: var(--lh-ink-soft); margin: 0 0 18px; max-width: 44ch; }

/* ---------- toast (gentle nudges) ---------- */
.lh-toast-lane {
  position: fixed; left: 50%; bottom: calc(26px + var(--safe));
  transform: translateX(-50%);
  z-index: 880; display: flex; flex-direction: column-reverse;
  gap: 10px; pointer-events: none; width: min(520px, 92vw);
}
.lh-toast {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px; border-radius: var(--lh-r-pill);
  background: var(--lh-panel);
  box-shadow: var(--lh-edge-2), var(--lh-air-2);
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--lh-size-body-lg);
  color: var(--lh-ink);
  animation: lh-toast-in .34s cubic-bezier(.2,1.4,.4,1) both;
}
.lh-toast--warm { background: linear-gradient(180deg, var(--lh-panel), var(--lh-butter)); }
.lh-toast--good { background: linear-gradient(180deg, var(--lh-panel), var(--lh-vet-tint-2)); }
.lh-toast.is-leaving { animation: lh-toast-out .3s ease forwards; }
@keyframes lh-toast-in  { from { opacity:0; transform: translateY(26px) scale(.9) } to { opacity:1; transform:none } }
@keyframes lh-toast-out { to { opacity: 0; transform: translateY(14px) scale(.94) } }

/* ---------- particles ---------- */
.lh-confetti {
  position: absolute; width: 13px; height: 18px; border-radius: 3px;
  will-change: transform, opacity;
}
.lh-spark {
  position: absolute; font-size: 24px; will-change: transform, opacity;
  filter: drop-shadow(0 2px 4px rgba(46,42,68,.15));
}
.lh-floater {
  position: absolute; font-family: var(--lh-font-display); font-weight: 800;
  font-size: var(--lh-size-h3); color: var(--lh-paper);
  text-shadow: 0 3px 0 rgba(46,42,68,.35);
  animation: lh-rise 1.25s ease-out forwards;
  white-space: nowrap;
}

/* ---------- speech bubble ---------- */
.lh-bubble {
  position: relative;
  background: var(--lh-panel);
  border-radius: var(--lh-r-xl);
  padding: 16px 22px;
  box-shadow: var(--lh-edge-1), var(--lh-air-1);
  font-family: var(--lh-font-display);
  font-weight: 700;
  font-size: var(--lh-size-body-lg);
  color: var(--lh-ink);
  max-width: 34ch;
  animation: lh-pop .35s cubic-bezier(.2,1.3,.4,1.1) both;
}
.lh-bubble::after {
  content: ""; position: absolute; bottom: -14px; left: 34px;
  border: 12px solid transparent; border-top-color: var(--lh-panel); border-bottom: 0;
  filter: drop-shadow(0 3px 1px rgba(46,42,68,.1));
}
.lh-bubble--thought { background: var(--lh-paper); font-style: italic; }
.lh-bubble--translate {
  background: var(--lh-marigold); color: var(--lh-marigold-ink); font-size: var(--lh-size-body);
  padding: 10px 18px; max-width: 30ch;
}
.lh-bubble--translate::after { border-top-color: var(--lh-marigold); }

/* ---------- scrollbars (chunky + friendly) ---------- */
.lh-screen__scroll::-webkit-scrollbar { width: 12px; }
.lh-screen__scroll::-webkit-scrollbar-thumb {
  background: rgba(46,42,68,.22); border-radius: var(--lh-r-pill); border: 3px solid transparent;
  background-clip: padding-box;
}

/* ---------- character artwork ---------- */
.lh-charsvg { width: 100%; height: 100%; overflow: visible; display: block; }
.lh-patient-art { width: 100%; height: 100%; display: block; }

.lh-char-idle { animation: lh-bob-slow 3.4s ease-in-out infinite; transform-origin: 100px 240px; }
.lh-char-head { animation: lh-sway 5.2s ease-in-out infinite; transform-origin: 100px 130px; }
.lh-tail-wag  { animation: lh-wag 0.9s ease-in-out infinite; }
.lh-ear--l, .lh-ear--r { animation: lh-sway 3.8s ease-in-out infinite; transform-origin: 100px 80px; }
.lh-wing--l { animation: lh-sway 2.6s ease-in-out infinite; }
.lh-wing--r { animation: lh-sway 2.6s ease-in-out infinite reverse; }
.lh-ear--bunny { animation: lh-sway 4.4s ease-in-out infinite; transform-origin: 100px 110px; }

/* reaction states the case runner toggles on the patient wrapper */
.lh-patient-art.lh-react--happy  { animation: lh-patient-hop .7s cubic-bezier(.25,1.6,.4,1); }
.lh-patient-art.lh-react--wiggle { animation: lh-wiggle .5s ease-in-out 2; }
.lh-patient-art.lh-react--shy    { animation: lh-patient-shy .8s ease; }
@keyframes lh-patient-hop { 0%,100% { transform: translateY(0) scale(1) } 40% { transform: translateY(-26px) scale(1.05) } 70% { transform: translateY(0) scale(.96,1.04) } }
@keyframes lh-patient-shy { 0%,100% { transform: translateX(0) } 30% { transform: translateX(-10px) rotate(-3deg) } 65% { transform: translateX(6px) rotate(2deg) } }


/* ── screens.css ─────────────────────────────── */
/* ==========================================================================
   Screens: title, creator, hub, level select, bag, shop,
   results. Shared layout helpers live at the bottom.
   ========================================================================== */

/* ══════════════════════════════════════════════════════════ TITLE ═══════ */
/* Four depth planes fill the screen; the words and the hero sit on top. */
.lh-screen--title { background: var(--lh-sky-grad); }
.lh-screen--title .lh-scene {
  position: absolute; inset: 0;
  /* The front door gets a real blue overhead — the doctor world's mist is
     for its rooms, not for the sky over the town. */
  background: linear-gradient(180deg,#8FDCF7 0%,#BDEEFB 42%,#E9F8E4 70%,#F6EBD3 100%);
}

.title-hero {
  position: absolute; right: 16%; bottom: 112px; width: min(24vw, 300px);
  z-index: 2; pointer-events: none;
}
.title-hero__art {
  animation: lh-breathe 3.8s ease-in-out infinite;
  transform-origin: bottom center;
  filter: drop-shadow(0 14px 18px rgba(46,42,68,.22));
}
.title-hero__art svg { width: 100%; height: auto; display: block; }

.title-stack {
  position: absolute; left: 5.6%; top: 13%; width: min(44vw, 520px);
  z-index: 3; display: flex; flex-direction: column; align-items: flex-start;
}

.title-kicker {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 9px 20px 9px 10px; border-radius: var(--lh-r-pill);
  background: rgba(255,255,255,.96); box-shadow: 0 6px 0 rgba(46,42,68,.14);
  margin-bottom: 20px;
  font-family: var(--lh-font-display); font-weight: 800;
  font-size: var(--lh-size-meta); letter-spacing: 1.8px; color: #5F5A7E;
}
.title-kicker__mark {
  width: 38px; height: 38px; border-radius: 50%; background: var(--lh-rasp);
  display: grid; place-items: center;
}
.title-kicker__mark svg { width: 24px; }

.title-wordmark {
  font-family: var(--lh-font-display); font-weight: 800;
  line-height: .9; letter-spacing: var(--lh-track-tight);
  margin: 0; display: flex; flex-direction: column; align-items: flex-start;
}
.title-word { display: block; animation: lh-letter .5s cubic-bezier(.2,1.4,.4,1) both; }
.title-word--1 {
  font-size: clamp(34px, 5vw, var(--lh-size-title-1)); color: var(--lh-paper);
  text-shadow: 0 5px 0 var(--lh-doc), 0 10px 20px rgba(46,42,68,.3);
}
.title-word--2 {
  font-size: clamp(50px, 7.5vw, var(--lh-size-hero)); color: var(--lh-star);
  text-shadow: 0 6px 0 var(--lh-star-deep), 0 14px 26px rgba(46,42,68,.32);
  animation-delay: .12s;
}
.title-word--3 {
  font-size: clamp(31px, 4.5vw, var(--lh-size-title-2)); color: var(--lh-paper);
  text-shadow: 0 5px 0 var(--lh-rasp), 0 10px 20px rgba(46,42,68,.3);
  animation-delay: .24s;
}

.title-sub {
  margin: 22px 0 30px;
  font-family: var(--lh-font-display);
  font-size: clamp(19px, 2vw, 24px); font-weight: 800; color: #2E4A52;
  text-shadow: 0 2px 0 rgba(255,255,255,.5); max-width: 26ch;
}

.title-actions { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.title-returning { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.title-returning span {
  font-family: var(--lh-font-display); font-weight: 800; font-size: 18px;
  color: #2E4A52; text-shadow: 0 2px 0 rgba(255,255,255,.5);
}

.title-foot {
  position: absolute; left: 0; bottom: 0; width: 100%; z-index: 3;
  padding: 12px; text-align: center;
  font-family: var(--lh-font-display); font-weight: 800;
  font-size: var(--lh-size-label); color: #EAF6E9;
}

/* On a narrow screen the hero steps behind the words rather than fighting
   them, and the wordmark takes the middle. */
@media (max-width: 820px) {
  .title-stack { left: 50%; transform: translateX(-50%); width: min(92vw, 520px); align-items: center; text-align: center; top: 9%; }
  .title-wordmark, .title-actions { align-items: center; }
  .title-hero { right: 50%; transform: translateX(50%); bottom: 90px; width: min(46vw, 220px); opacity: .5; }
}


/* ══════════════════════════════════════════════════════ CREATOR ═════════ */
.lh-screen--creator { background: var(--lh-sky-grad); }

.creator-grid {
  display: grid; gap: 16px; padding: 0 16px 20px;
  grid-template-columns: 1fr;
  align-items: start;
}
@media (min-width: 860px) {
  .creator-grid { grid-template-columns: minmax(260px, 380px) 1fr; padding: 0 26px 26px; }
}

.hero-preview {
  position: sticky; top: 0;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: rgba(255,255,255,.7); border-radius: var(--lh-r-pill);
  padding: 14px; box-shadow: var(--lh-edge-1), var(--lh-air-1); backdrop-filter: blur(6px);
}
.hero-preview__art { width: min(56vw, 230px); aspect-ratio: 200/250; }
.hero-preview__name {
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-2);
  display: flex; align-items: center; gap: 8px;
}

.name-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.name-input {
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-1);
  padding: 10px 18px; border-radius: var(--lh-r-pill); border: 3px solid rgba(46,42,68,.14);
  background: var(--lh-panel); color: var(--lh-ink); text-align: center; width: min(260px, 70vw);
  min-height: 52px;
}
.name-input:focus { outline: none; border-color: var(--lh-sky); }
.name-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.name-chip {
  border: none; border-radius: var(--lh-r-pill); padding: 8px 14px; min-height: 40px;
  background: var(--lh-panel); box-shadow: 0 3px 0 rgba(46,42,68,.14);
  font-family: var(--lh-font-display); font-weight: 700; font-size: 15px; cursor: pointer;
}
.name-chip:hover { transform: translateY(-2px); }


.difficulty-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); }
.diff-card {
  border: none; border-radius: var(--lh-r-xl); padding: 16px; cursor: pointer;
  background: linear-gradient(180deg,var(--lh-panel),#f7fbff); text-align: left;
  box-shadow: 0 6px 0 rgba(46,42,68,.14), 0 12px 22px rgba(46,42,68,.12);
  display: flex; gap: 12px; align-items: flex-start;
  transition: transform .14s;
}
.diff-card:hover { transform: translateY(-3px); }
.diff-card[aria-pressed='true'] { box-shadow: 0 6px 0 var(--lh-doc-deep), 0 0 0 5px rgba(63,208,166,.4); background: linear-gradient(180deg,#f2fffa,#dcfbee); }
.diff-card__icon { font-size: 38px; }
.diff-card h3 { font-size: var(--step-1); }
.diff-card p { margin: 4px 0 0; font-size: 14px; color: var(--lh-ink-soft); line-height: 1.35; }

/* ══════════════════════════════════════════════════════ CAREER ══════════ */
/* ══════════════════════════════════════════════════════ HUB ═════════════ */
.lh-screen--hub { background: var(--lh-sky-grad); }
.hub-scroll { display: flex; flex-direction: column; align-items: center; gap: 10px; }

.building-wrap { width: min(96vw, 720px); padding: 4px 8px 10px; }

.floor {
  display: grid; gap: 8px; margin-bottom: 8px;
}
.floor--1 { grid-template-columns: 1fr; }
.floor--2 { grid-template-columns: 1fr 1fr; }

.room {
  position: relative; overflow: hidden;
  border: none; border-radius: var(--lh-r-sm);
  min-height: clamp(96px, 15vh, 150px);
  cursor: pointer; padding: 0;
  box-shadow: 0 7px 0 rgba(46,42,68,.16), 0 14px 26px rgba(46,42,68,.16);
  transition: transform .16s cubic-bezier(.3,1.4,.5,1), box-shadow .16s;
  text-align: left;
}
.room:hover { transform: translateY(-4px); }
.room:active { transform: translateY(3px); }
.room:focus-visible { outline: 4px solid var(--lh-ink); outline-offset: 3px; }
.room__wall { position: absolute; inset: 0; background: linear-gradient(180deg, var(--wall), var(--tint)); }
.room__floorline { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: rgba(46,42,68,.1); }
.room__prop { position: absolute; transform: translate(-50%,-50%); filter: drop-shadow(0 3px 3px rgba(46,42,68,.18)); }
.room__label {
  position: absolute; left: 8px; top: 8px;
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: var(--lh-r-pill);
  background: rgba(255,255,255,.92);
  font-family: var(--lh-font-display); font-weight: 800; font-size: clamp(12px, 2vw, 16px);
  box-shadow: 0 2px 6px rgba(46,42,68,.14);
}
.room__go {
  position: absolute; right: 8px; bottom: 8px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.94); display: grid; place-items: center; font-size: 20px;
  box-shadow: 0 3px 0 rgba(46,42,68,.16);
  animation: lh-bob-slow 2.6s ease-in-out infinite;
}
.room__count {
  position: absolute; right: 8px; top: 8px;
  padding: 4px 12px; border-radius: var(--lh-r-pill);
  background: rgba(255,255,255,.94); font-family: var(--lh-font-display); font-weight: 800; font-size: 13px;
  box-shadow: 0 2px 6px rgba(46,42,68,.14);
}

.room--locked { cursor: pointer; }
.room--locked .room__wall { filter: grayscale(.75) brightness(.86); }
.room--locked::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(255,200,68,.24) 0 18px, rgba(46,42,68,.16) 18px 36px);
}
.room__lock {
  position: absolute; inset: 0; z-index: 2;
  background: radial-gradient(70% 70% at 50% 50%, rgba(38,45,72,.62), rgba(38,45,72,.34));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--lh-panel); text-shadow: 0 3px 0 rgba(46,42,68,.5); text-align: center; padding: 8px;
}
.room__lock-icon { font-size: clamp(26px, 5vw, 42px); animation: lh-bob-slow 3s ease-in-out infinite; }
.room__lock-name { font-family: var(--lh-font-display); font-weight: 800; font-size: clamp(13px, 2.4vw, 19px); }
.room__lock-how {
  font-size: clamp(11px, 1.8vw, 13px); line-height: 1.25; opacity: .96;
  max-width: 24ch; text-wrap: balance;
}

.room--roof {
  min-height: clamp(66px, 10vh, 110px);
  background: transparent; box-shadow: none;
  border-radius: var(--lh-r-sm) var(--lh-r-sm) 0 0;
}
.room--roof .room__wall { background: linear-gradient(180deg, transparent, rgba(255,255,255,.4)); }

.roof-cap {
  height: 22px; border-radius: 14px 14px 0 0;
  background: linear-gradient(180deg,#ff8f80,#e9584a);
  box-shadow: 0 5px 0 #c33f33;
  margin-bottom: 8px;
  display: grid; place-items: center; color: var(--lh-panel); font-weight: 900; font-size: 14px;
  font-family: var(--lh-font-display); letter-spacing: 2px;
}
.hub-ground {
  height: 26px; border-radius: 0 0 20px 20px;
  background: linear-gradient(180deg,#8fc978,#6fae5c);
  box-shadow: 0 8px 0 rgba(46,42,68,.14);
}

.hub-hero {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,.86); border-radius: var(--lh-r-pill);
  padding: 10px 18px 10px 10px; box-shadow: var(--lh-edge-1), var(--lh-air-1);
  width: min(96vw, 720px);
}
.hub-hero__art { width: 62px; aspect-ratio: 200/250; flex: none; }
.hub-hero__text { flex: 1; }
.hub-hero__text h3 { font-size: var(--step-1); }
.hub-hero__text p { margin: 2px 0 0; font-size: 14px; color: var(--lh-ink-soft); }

.hub-actions {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  width: min(96vw,720px); padding: 6px 0 26px;
}

.construction {
  position: absolute; inset: 0; z-index: 6; display: grid; place-items: center;
  background: rgba(46,42,68,.55); border-radius: var(--lh-r-sm);
  font-size: clamp(30px, 7vw, 56px);
}
.construction span { animation: lh-wiggle .4s ease-in-out infinite; }

/* ══════════════════════════════════════════════════ LEVEL SELECT ════════ */
.lh-screen--levels { background: var(--lh-sky-grad); }


/* The world header bar: a band in the world's own hue, so the paper-white
   name and the drawn mark both have a ground to sit on. */
.levels-header {
  background: linear-gradient(180deg, var(--lh-accent-deep), var(--lh-accent));
  border-radius: 0 0 var(--lh-r-xl) var(--lh-r-xl);
  box-shadow: 0 8px 0 rgba(46,42,68,.10), var(--lh-air-1);
  margin-bottom: 18px;
}
.levels-header .lh-hud__title {
  font-size: clamp(24px, 3vw, var(--lh-size-h2));
  color: var(--lh-paper); text-shadow: 0 3px 0 rgba(31,94,104,.4);
}
.levels-world { display: flex; align-items: center; gap: 12px; }
.levels-world__mark {
  width: 52px; height: 52px; border-radius: var(--lh-r-xs);
  background: rgba(255,255,255,.24); display: grid; place-items: center;
}

.level-list { display: grid; gap: 20px; padding: 20px 16px calc(24px + var(--safe)); width: min(96vw, 760px); margin: 0 auto; }

/* ══════════════════════════════════════════════════════ BAG / SHOP ══════ */
.lh-screen--bag  { background: linear-gradient(180deg, var(--lh-canvas-top), var(--lh-canvas-bot)); }
.lh-screen--shop { background: linear-gradient(180deg, var(--lh-canvas-top), var(--lh-canvas-bot)); }

.lh-section-title { display: flex; align-items: center; gap: 12px; padding: 6px 18px 10px; width: min(96vw, 900px); margin: 0 auto; }
.lh-section-title__icon { font-size: 34px; }
.lh-section-title h2 { font-size: var(--step-2); }
.lh-section-title p { margin: 2px 0 0; font-size: 14px; color: var(--lh-ink-soft); }

.lh-card-grid {
  display: grid; gap: 12px; padding: 0 16px 20px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  width: min(96vw, 900px); margin: 0 auto;
}

.kit {
  position: relative; border-radius: var(--lh-r-xl); padding: 14px 12px;
  background: linear-gradient(180deg,var(--lh-panel),#f7fbff); text-align: center;
  box-shadow: 0 6px 0 rgba(46,42,68,.13), 0 12px 22px rgba(46,42,68,.12);
  border: none; cursor: pointer; transition: transform .15s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.kit:hover { transform: translateY(-4px); }
.kit__icon { font-size: 44px; filter: drop-shadow(0 4px 4px rgba(46,42,68,.18)); }
.kit__name { font-family: var(--lh-font-display); font-weight: 800; font-size: 15px; }
.kit__blurb { font-size: 12px; color: var(--lh-ink-soft); line-height: 1.3; }
.kit--locked { filter: grayscale(.9) opacity(.62); cursor: default; }
.kit--locked .kit__icon { filter: blur(2.5px) grayscale(1); }
.kit--locked:hover { transform: none; }
/* Corner badge, not a cover — the "???" name is half the fun of a collection. */
.kit__lock {
  position: absolute; top: -6px; right: -6px;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-size: 17px;
  background: var(--lh-panel); box-shadow: 0 3px 0 rgba(46,42,68,.18);
}
.kit--new::after {
  content: "NEW!"; position: absolute; top: -8px; right: -6px;
  background: var(--lh-rasp); color: var(--lh-panel); font-family: var(--lh-font-display); font-weight: 800;
  font-size: 11px; padding: 3px 10px; border-radius: 99px; box-shadow: 0 3px 0 var(--lh-rasp-deep);
  animation: lh-wiggle 2s ease-in-out infinite;
}

.shop-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; width: min(96vw,900px); margin: 0 auto; }
.shop-tab {
  flex: none; border: none; border-radius: var(--lh-r-pill); padding: 10px 18px; min-height: 48px;
  background: rgba(255,255,255,.85); cursor: pointer;
  font-family: var(--lh-font-display); font-weight: 800; font-size: 15px; color: var(--lh-ink);
  box-shadow: 0 4px 0 rgba(46,42,68,.14);
  display: flex; align-items: center; gap: 6px;
}
.shop-tab[aria-selected='true'] { background: var(--lh-marigold); box-shadow: 0 4px 0 var(--lh-marigold-deep); color: var(--lh-marigold-ink); }

.buy { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.buy__price {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 4px;
  padding: 5px 14px; border-radius: 99px; background: var(--lh-marigold); color: var(--lh-marigold-ink);
  font-family: var(--lh-font-display); font-weight: 800; font-size: 15px;
  box-shadow: 0 3px 0 var(--lh-marigold-deep);
}
.buy--owned .buy__price { background: var(--lh-doc); box-shadow: 0 3px 0 var(--lh-doc-deep); color: #08533c; }
.buy--poor { filter: grayscale(.4); }
.buy--poor .buy__price { background: #dfe4ee; box-shadow: 0 3px 0 #b8c0d0; color: #6c7590; }

/* ══════════════════════════════════════════════════════ RESULTS ════════ */
.lh-screen--results {
  background: linear-gradient(180deg,#ffd98a,#ffb3c6 55%,#c9a6ff);
  align-items: center; justify-content: center;
}
.results-card {
  width: min(560px, 94vw); text-align: center;
  background: rgba(255,255,255,.96); border-radius: var(--lh-r-pill);
  box-shadow: var(--lh-edge-4), var(--lh-air-3); padding: 20px 22px calc(26px + var(--safe));
  max-height: 94vh; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain;
  animation: lh-pop .5s cubic-bezier(.2,1.3,.4,1.1) both;
}
.results-card h2 { font-size: clamp(21px, 5vw, 36px); margin-bottom: 4px; text-wrap: balance; }
.results-card__sub { font-size: var(--step-1); color: var(--lh-ink-soft); margin: 0 0 14px; }
.results-patient { width: min(38vw, 142px); aspect-ratio: 200/250; margin: 0 auto; }
.results-rewards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
.reward-pill {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 18px; border-radius: var(--lh-r-xl); min-width: 96px;
  background: linear-gradient(180deg,var(--lh-panel),#fff4dc); box-shadow: 0 5px 0 rgba(46,42,68,.14);
  animation: lh-pop .5s cubic-bezier(.2,1.5,.4,1.1) both;
}
.reward-pill__icon { font-size: 28px; }
.reward-pill__value { font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-2); }
.reward-pill__label { font-size: 12px; color: var(--lh-ink-soft); }

.unlock-strip {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  margin: 10px 0 4px;
}
.unlock-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: var(--lh-r-pill);
  background: linear-gradient(180deg,var(--lh-panel),#e8fff6);
  box-shadow: 0 4px 0 var(--lh-doc-deep);
  font-family: var(--lh-font-display); font-weight: 800; font-size: 15px;
  animation: lh-pop .5s cubic-bezier(.2,1.5,.4,1.1) both;
}
.unlock-chip__icon { font-size: 24px; }

.badge-strip { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.badge-pill {
  padding: 8px 16px; border-radius: var(--lh-r-pill);
  background: linear-gradient(180deg,#fff6d9,#ffe6a0); box-shadow: 0 4px 0 var(--lh-marigold-deep);
  font-family: var(--lh-font-display); font-weight: 800; font-size: 14px; color: var(--lh-marigold-ink);
}

/* ══════════════════════════════════════════════════ TOOL UNLOCK MODAL ═══ */
.newtool { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.newtool__kicker {
  font-family: var(--lh-font-display); font-weight: 800; letter-spacing: 3px;
  color: var(--lh-rasp); font-size: var(--step-1);
  animation: lh-twinkle 1.4s ease-in-out infinite;
}
.newtool__icon {
  font-size: clamp(64px, 16vw, 120px);
  filter: drop-shadow(0 10px 14px rgba(46,42,68,.3));
  animation: lh-pop .6s cubic-bezier(.2,1.6,.4,1.1) both, lh-bob 2.6s .6s ease-in-out infinite;
}
.newtool__name { font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-3); }
.newtool__blurb { font-size: var(--step-1); color: var(--lh-ink-soft); max-width: 30ch; }

/* ══════════════════════════════════════════════════════ SHARED ═════════ */

.empty-note {
  text-align: center; color: var(--lh-ink-soft); font-size: var(--step-0);
  padding: 20px; font-family: var(--lh-font-display); font-weight: 700;
}

/* ── The Doctor Bag's little "what does it do?" loop ────────────────────── */
.tool-demo {
  position: relative;
  width: min(340px, 78vw); height: 132px;
  margin: 4px auto 6px;
  border-radius: var(--lh-r-xl);
  background: radial-gradient(70% 90% at 50% 100%,
              color-mix(in srgb, var(--tint) 26%, var(--lh-panel)), #f7fbff);
  overflow: hidden;
}
.tool-demo::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background: rgba(46,42,68,.07);
}
.tool-demo__patient, .tool-demo__pet {
  position: absolute; bottom: 16px; font-size: 46px;
  animation: lh-demo-patient 3.2s ease-in-out infinite;
}
.tool-demo__patient { left: 22%; }
.tool-demo__pet { right: 22%; animation-delay: .35s; }
.tool-demo__tool {
  position: absolute; left: 50%; top: 50%; font-size: 40px;
  filter: drop-shadow(0 4px 5px rgba(46,42,68,.28));
  animation: lh-demo-tool 3.2s cubic-bezier(.3,.9,.4,1.2) infinite;
}
.tool-demo__spark { position: absolute; font-size: 20px; opacity: 0; }
.tool-demo__spark--a { left: 32%; top: 26%; animation: lh-demo-spark 3.2s ease-in-out infinite 1.1s; }
.tool-demo__spark--b { right: 32%; top: 34%; animation: lh-demo-spark 3.2s ease-in-out infinite 1.35s; }

@keyframes lh-demo-tool {
  0%   { transform: translate(-50%,-50%) scale(.6) rotate(-18deg); opacity: 0 }
  18%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1 }
  38%  { transform: translate(-118%,-24%) scale(1.05) rotate(-8deg); opacity: 1 }
  58%  { transform: translate(18%,-24%) scale(1.05) rotate(8deg); opacity: 1 }
  78%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1 }
  100% { transform: translate(-50%,-50%) scale(.6) rotate(18deg); opacity: 0 }
}
@keyframes lh-demo-patient {
  0%, 30%, 100% { transform: translateY(0) }
  70%  { transform: translateY(-10px) }
  85%  { transform: translateY(0) scale(1.06) }
}
@keyframes lh-demo-spark {
  0%, 40% { opacity: 0; transform: scale(.4) }
  60%     { opacity: 1; transform: scale(1.2) }
  90%     { opacity: 0; transform: scale(.8) translateY(-14px) }
}
.newtool__demo { font-style: italic; color: var(--lh-ink-soft); font-size: var(--step-0); margin: 6px 0 0; }


/* ── case.css ─────────────────────────────── */
/* ==========================================================================
   The case screen — stage on top, interaction panel below.
   On wide screens the panel moves to the right so the patient stays huge.
   ========================================================================== */

.case-root {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex; flex-direction: column;
  background: var(--lh-canvas);
}

/* ------------------------------------------------------------------ stage */
.case-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

.case-scene {
  position: absolute; inset: 0;
  display: grid;
  place-items: end center;
  padding-bottom: 5%;
}

.case-patient {
  position: relative;
  height: 72%;
  aspect-ratio: 200 / 250;
  max-width: 62%;
  filter: drop-shadow(0 14px 18px rgba(46,42,68,.22));
  z-index: 2;
}

.case-overlay { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.case-overlay > * { pointer-events: auto; }

.lh-bubble-lane {
  position: absolute; left: 3%; top: 3%; padding-right: 4px;
  display: flex; flex-direction: column; gap: 8px;
  max-width: min(40ch, 56%);
  z-index: 4; pointer-events: none;
}
.lh-bubble-lane .lh-bubble { font-size: clamp(14px, 1.5vw + 9px, 21px); }
.lh-bubble-lane .lh-bubble--settled { opacity: .96; }
.lh-bubble-lane .lh-bubble:not(:last-child) {
  opacity: .5; transform: scale(.93); transform-origin: left top;
  max-height: 3.4em; overflow: hidden;
}
.lh-bubble--narrator, .lh-bubble--nurse { background: var(--lh-paper); }
.lh-bubble--hero { background: #e2f4ff; }
.lh-bubble--hero::after { border-top-color: #e2f4ff; }
.lh-bubble--narrator::after, .lh-bubble--nurse::after { border-top-color: var(--lh-paper); }
.lh-bubble__tkey { opacity: .8; }

.case-nametag {
  position: absolute; right: 12px; top: 12px; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px 8px 10px; border-radius: var(--lh-r-pill);
  background: rgba(255,255,255,.95); box-shadow: var(--lh-edge-1), var(--lh-air-1);
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-1);
}
.case-nametag__emoji { font-size: 26px; }

.case-tally {
  position: absolute; left: 12px; bottom: 10px; z-index: 6;
  display: flex; gap: 8px;
}
.lh-chip--tiny { height: 38px; font-size: var(--step-0); padding: 0 14px 0 10px; }
.lh-chip--tiny .lh-chip__icon { font-size: 18px; }

/* ------------------------------------------------------------- step dots */
.case-dots {
  display: flex; gap: 6px; justify-content: center;
  padding: 8px 12px 4px; flex: none; flex-wrap: wrap;
}
.case-dots i {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(46,42,68,.2); transition: all .3s;
}
.case-dots i.done { background: var(--lh-doc); }
.case-dots i.now  { background: var(--lh-marigold); transform: scale(1.6); box-shadow: 0 0 0 4px rgba(255,200,68,.28); }

/* ------------------------------------------------------------------ panel */
.case-panel {
  flex: none;
  max-height: 52vh;   /* fallback for browsers without dynamic viewport units */
  max-height: 52dvh;  /* `vh` on a phone is the URL-bar-hidden height, which
                         let the panel run off the bottom of the screen */
  overflow-y: auto;
  padding: 4px 16px calc(26px + var(--safe));
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}

.panel__prompt { text-align: center; }
.panel__prompt-main {
  font-family: var(--lh-font-display); font-weight: 800;
  font-size: var(--step-2); line-height: 1.15; color: var(--lh-ink);
}
.panel__prompt-sub { font-size: var(--step-0); color: var(--lh-ink-soft); margin-top: 4px; }

.panel__body { width: 100%; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }

.panel__teach {
  display: flex; align-items: flex-start; gap: 10px;
  background: linear-gradient(180deg,#fffdf5,#fff2d4);
  border-radius: var(--lh-r-sm); padding: 12px 18px;
  font-size: var(--step-0); color: #7a5a12; line-height: 1.35;
  box-shadow: var(--lh-edge-1), var(--lh-air-1); max-width: 62ch;
  animation: lh-pop .35s cubic-bezier(.2,1.3,.4,1.1) both;
}
.panel__teach-icon { font-size: 22px; }

.lh-btn--wide { width: min(340px, 100%); }
.lh-btn__arrow { animation: lh-wiggle 1.4s ease-in-out infinite; }

/* ------------------------------------------------------------- tool tray */
.tool-tray {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  width: 100%;
}
.tool {
  --tool-tint: var(--lh-sky);
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  width: clamp(88px, 21vw, 118px); padding: 12px 6px 10px;
  border: none; border-radius: var(--lh-r-sm);
  background: linear-gradient(180deg, var(--lh-panel), #f4f8ff);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--tool-tint) 55%, #2E2A44),
              0 12px 22px rgba(46,42,68,.18);
  cursor: grab; touch-action: none; user-select: none;
  transition: transform .14s cubic-bezier(.3,1.4,.5,1), box-shadow .14s;
}
.tool:hover { transform: translateY(-4px); }
.tool:active, .tool--dragging { cursor: grabbing; transform: translateY(3px) scale(.97); }
.tool__icon {
  font-size: 40px; line-height: 1;
  filter: drop-shadow(0 3px 3px rgba(46,42,68,.2));
}
.tool__name {
  font-family: var(--lh-font-display); font-weight: 700; font-size: 13px;
  color: var(--lh-ink-soft); text-align: center; line-height: 1.1;
}
.tool--glow { animation: lh-glow-ring 1.5s ease-in-out infinite; }
.tool--armed { outline: 5px solid var(--lh-marigold); outline-offset: 3px; transform: translateY(-6px) scale(1.06); }
.tool--shake { animation: lh-wiggle .48s ease-in-out; }
.tool--away { opacity: .35; transform: scale(.9); pointer-events: none; }

.tool-ghost {
  position: fixed; z-index: 950; pointer-events: none;
  transform: translate(-50%,-50%) scale(1.25);
  width: 76px; height: 76px; border-radius: 50%;
  display: grid; place-items: center; font-size: 42px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 10px 26px rgba(46,42,68,.35);
  animation: lh-pop .18s ease both;
}

.tool-stuck {
  position: absolute; transform: translate(-50%,-50%);
  font-size: clamp(34px, 6vw, 54px); z-index: 6;
  filter: drop-shadow(0 4px 6px rgba(46,42,68,.3));
  animation: lh-pop .3s cubic-bezier(.2,1.4,.4,1) both;
  pointer-events: none;
}

/* ----------------------------------------------------------- target spot */
.spot-marker {
  position: absolute; transform: translate(-50%,-50%);
  width: 84px; height: 84px; display: grid; place-items: center;
  pointer-events: none; z-index: 5;
}
.spot-marker__ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 5px dashed var(--lh-marigold);
  animation: lh-spin 9s linear infinite;
}
@keyframes lh-spin { to { transform: rotate(360deg) } }
.spot-marker__dot {
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(255,255,255,.85); display: grid; place-items: center;
  font-size: 26px; opacity: .55;
  animation: lh-bob 2s ease-in-out infinite;
}
.spot-marker--hit { animation: lh-pop .3s reverse forwards; }

.spots circle { pointer-events: auto; }
.spot--over { fill: rgba(255,200,68,.4) !important; }

/* -------------------------------------------------------------- gauges */
.gauge {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 26px; border-radius: var(--lh-r-xl);
  background: var(--lh-panel); box-shadow: var(--lh-edge-2), var(--lh-air-2);
  touch-action: none; user-select: none;
  animation: lh-pop .3s cubic-bezier(.2,1.3,.4,1.1) both;
}
.gauge--hold { width: 168px; cursor: pointer; }
.gauge__ring { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) rotate(-90deg); width: 108px; height: 108px; }
.gauge__track { fill: none; stroke: rgba(46,42,68,.12); stroke-width: 10; }
.gauge__fill  { fill: none; stroke: var(--lh-marigold); stroke-width: 10; stroke-linecap: round; transition: stroke .2s; }
.gauge--pressing .gauge__fill { stroke: var(--lh-doc); }
.gauge__icon { font-size: 48px; height: 108px; display: grid; place-items: center; }
.gauge__label { font-family: var(--lh-font-display); font-weight: 700; font-size: var(--step-0); color: var(--lh-ink-soft); }
.gauge--done { animation: lh-pop .26s reverse forwards; }
.gauge--pressing { box-shadow: var(--lh-edge-1), var(--lh-air-1), 0 0 0 6px rgba(63,208,166,.25); }

.gauge--rub { width: min(340px, 100%); cursor: ew-resize; }
.gauge__icon--rub { font-size: 44px; height: 60px; transition: transform .06s linear; }
.gauge__pips { display: flex; gap: 6px; }
.gauge__pips i {
  width: 16px; height: 10px; border-radius: 99px; background: rgba(46,42,68,.16);
  transition: background .2s, transform .2s;
}
.gauge__pips i.on { background: var(--lh-doc); transform: scaleY(1.5); }

/* ------------------------------------------------------------- readouts */
.readout {
  --tint: var(--lh-sky);
  width: min(420px, 100%);
  background: var(--lh-panel); border-radius: var(--lh-r-xl);
  box-shadow: var(--lh-edge-2), var(--lh-air-2); padding: 14px 20px;
  border-top: 8px solid var(--tint);
  animation: lh-pop .38s cubic-bezier(.2,1.3,.4,1.1) both;
}
.readout__head {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-0);
  color: var(--lh-ink-soft); text-transform: uppercase; letter-spacing: .5px;
}
.readout__icon { font-size: 22px; }
.readout__value { display: flex; align-items: baseline; gap: 6px; justify-content: center; }
.readout__num {
  font-family: var(--lh-font-display); font-weight: 800;
  font-size: clamp(38px, 8vw, 62px); color: var(--tint); line-height: 1;
}
.readout__unit { font-family: var(--lh-font-display); font-weight: 700; font-size: var(--step-1); color: var(--lh-ink-soft); }
.readout__text {
  font-family: var(--lh-font-display); font-weight: 700; font-size: var(--step-1);
  color: var(--lh-ink); text-align: center; padding: 6px 0;
}
.readout__note { font-size: var(--step-0); color: var(--lh-ink-soft); text-align: center; }
.readout__ecg { color: var(--tint); }
.readout__ecg svg { width: 100%; height: 54px; }

/* --------------------------------------------------------------- choices */
.choice-grid { display: grid; gap: 12px; width: 100%; max-width: 720px; }
.choice-grid--cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choice-grid--empathy { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.choice-grid--chips { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.choice-grid--shapes { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }

.choice {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 16px 14px; min-height: 96px;
  border: none; border-radius: var(--lh-r-xl);
  background: linear-gradient(180deg,var(--lh-panel),#f6f9ff);
  box-shadow: 0 6px 0 rgba(46,42,68,.16), 0 12px 22px rgba(46,42,68,.14);
  cursor: pointer; text-align: center;
  transition: transform .14s cubic-bezier(.3,1.4,.5,1), box-shadow .14s, filter .2s;
}
.choice:hover { transform: translateY(-3px); }
.choice:active { transform: translateY(3px); }
.choice:focus-visible { outline: 4px solid var(--lh-ink); outline-offset: 3px; }
.choice__icon { font-size: 38px; line-height: 1; }
.choice__label { font-family: var(--lh-font-display); font-weight: 700; font-size: var(--step-0); color: var(--lh-ink); line-height: 1.2; }
.choice__detail { font-size: 13px; color: var(--lh-ink-soft); font-style: italic; }
.choice--shapes .choice__icon { font-size: clamp(48px, 11vw, 80px); }
.choice--shapes { min-height: 120px; }
.choice--empathy { background: linear-gradient(180deg,var(--lh-panel),#fff1f6); }
.choice--right {
  background: linear-gradient(180deg,#e6fff4,#c6f7e2);
  box-shadow: 0 6px 0 var(--lh-doc-deep), 0 0 0 5px rgba(63,208,166,.35);
}
.choice--dim { opacity: .4; filter: grayscale(.5); }
.choice--wobble { animation: lh-wiggle .5s ease-in-out; }
.choice--glow { animation: lh-glow-ring 1.4s ease-in-out infinite; }
.choice--picked { background: linear-gradient(180deg,#fff0f6,#ffd9e8); box-shadow: 0 6px 0 #e06a99; }
.choice[disabled] { cursor: default; }

/* ------------------------------------------------------------ find spots */
.find-spot {
  position: absolute; transform: translate(-50%,-50%);
  width: 62px; height: 62px; border-radius: 50%;
  border: none; background: rgba(255,255,255,.55);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 4px 10px rgba(46,42,68,.2);
  animation: lh-pop .4s cubic-bezier(.2,1.3,.4,1.1) both;
  z-index: 6;
}
.find-spot__icon { font-size: 30px; animation: lh-bob-slow 3s ease-in-out infinite; }
.find-spot:hover { transform: translate(-50%,-50%) scale(1.12); }
.find-spot--halo { box-shadow: 0 0 0 5px rgba(255,200,68,.5), 0 4px 10px rgba(46,42,68,.2); }
.find-spot--found { animation: lh-pop .35s reverse forwards; pointer-events: none; }
.find-spot--wobble { animation: lh-wiggle .48s ease-in-out; }

.find-counter {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 20px; border-radius: var(--lh-r-pill);
  background: var(--lh-panel); box-shadow: var(--lh-edge-1), var(--lh-air-1);
  font-family: var(--lh-font-display); font-weight: 800; font-size: var(--step-1);
}
.find-counter__num { color: var(--lh-doc-deep); font-size: var(--step-2); }

/* ---------------------------------------------------------------- triage */
.triage { display: grid; gap: 10px; width: 100%; max-width: 620px; }
.triage__card {
  display: grid; grid-template-columns: 44px 54px 1fr; align-items: center; gap: 12px;
  padding: 12px 16px; border: none; border-radius: var(--lh-r-xl);
  background: linear-gradient(180deg,var(--lh-panel),#f6f9ff);
  box-shadow: 0 6px 0 rgba(46,42,68,.14), 0 10px 20px rgba(46,42,68,.12);
  cursor: pointer; text-align: left;
  transition: transform .14s, box-shadow .14s;
}
.triage__card:hover { transform: translateY(-3px); }
.triage__rank {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(46,42,68,.1); color: var(--lh-ink);
  font-family: var(--lh-font-display); font-weight: 800; font-size: 20px;
}
.triage__icon { font-size: 40px; }
.triage__body { display: flex; flex-direction: column; }
.triage__body strong { font-family: var(--lh-font-display); font-size: var(--step-1); }
.triage__body em { font-size: var(--step-0); color: var(--lh-ink-soft); font-style: normal; }
.triage__card--done { background: linear-gradient(180deg,#e6fff4,#c6f7e2); box-shadow: 0 6px 0 var(--lh-doc-deep); }
.triage__card--done .triage__rank { background: var(--lh-doc); color: var(--lh-panel); }
.triage__card--halo { animation: lh-glow-ring 1.5s ease-in-out infinite; }

/* --------------------------------------------------------------- scanner */
.scanner { width: 100%; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }

.xray-frame {
  position: absolute; transform: translate(-50%,-50%);
  width: clamp(120px, 28vw, 190px); aspect-ratio: 1;
  border-radius: 18px; cursor: grab; touch-action: none; z-index: 7;
  background: rgba(140,200,255,.16);
  box-shadow: inset 0 0 0 3px rgba(120,190,255,.7);
}
.xray-frame__corner { position: absolute; width: 26px; height: 26px; border: 6px solid var(--lh-toy); }
.xray-frame__corner.tl { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }

/**
 * Screen router.
 *
 * A "screen" is a factory: (params) => { el, destroy?, onEnter? }.
 * Only one is mounted at a time. A shallow history stack powers the always
 * present Back button so a child can never get stuck.

let root = null;

  const factory = registry.get(name);
  if (!factory) { console.error(`[router] unknown screen "${name}"`); return; }

  if (current) {
    try { current.instance.destroy?.(); } catch (e) { console.error(e); }
    current.instance.el.remove();
    if (!replace) stack.push({ name: current.name, params: current.params });

/**
 * Optional spoken prompts.
 *
 * A four-year-old cannot read "Drag the stethoscope onto the chest", so the
 * game can read it out. This uses the browser's built-in speech synthesis —
 * no audio files, no network, no dependency — and degrades to silence
 * wherever it is unavailable.

 * It is a separate toggle from the sound effects on purpose: a parent may
 * want the bleeps without the talking, or the talking without the bleeps.
 *

 * things in a row — "Good spotting!", then what was actually found, then the
 * fun fact — and cancelling on every call meant a child only ever heard the
 * last one, usually the generic praise. Anything that genuinely replaces what
 * came before (a new screen, a new step) calls `say(..., { interrupt: true })`
 * or `stop()`.

  if (!synth) return null;
  const voices = synth.getVoices();
  if (!voices.length) return null;
  const lang = (navigator.language || 'en-GB');
  // Prefer a local voice in the page language; fall back to any English one.
  return voices.find((v) => v.localService && v.lang === lang)
    || voices.find((v) => v.lang === lang)
    || voices.find((v) => v.lang?.startsWith('en'))
    || voices[0];

  const warm = () => { ready = true; };
  synth.addEventListener?.('voiceschanged', warm);
  // Some browsers already have voices; some only after a gesture.
  if (synth.getVoices().length) ready = true;

    window.addEventListener(evt, warm, { once: true, passive: true }));

  return next;

let speaking = false;

/**
 * Persistence layer.
 *
 * Everything the game stores goes through `load()` / `persist()` here, so
 * swapping localStorage for a cloud backend later means replacing only this
 * file: the shape of the save blob is a plain JSON document with an explicit
 * `schema` version and a `migrate()` chain.
 */

const KEY = 'littleHeroesHospital.save.v1';
const SCHEMA = 5;

/** The canonical empty save. Every field the game reads must exist here. */
function freshSave() {
  return {
    schema: SCHEMA,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    migratedAt: Date.now(),

    /** null until the player finishes the character creator */
    hero: null,           // { name, skin, hair, hairColor, glasses, coatColor, scrubs, shoes, accessory }
    difficulty: 'little', // 'little' | 'explorer'
    career: null,         // 'doctor' | 'vet'  (current focus — freely switchable)

    progress: {
      doctor: { level: 1, completed: [] }, // completed = array of case ids
      vet:    { level: 1, completed: [] },
      toy:    { level: 1, completed: [] },
    },

    wallet: { stars: 0, kindness: 0, coins: 0 },

    unlocked: {
      tools: ['stethoscope', 'thermometer'], // starter kit
      rooms: ['reception', 'doctor', 'vet', 'toyshop', 'supply'],
    },

    /** purchased shop item ids -> quantity (decor can be bought once) */
    purchased: {},

    /** ids of badges/awards earned, e.g. 'medical-detective' */
    badges: [],

    /** `voice` is filled in from the chosen difficulty in the creator. */
    settings: { sound: true, music: true, voice: true },

    /** small flags: tutorial seen, celebrations shown, etc. */
    flags: {},
  };
}

/** Upgrade older saves in place. Add a new `if (save.schema < N)` block per bump. */
function migrate(save) {
  if (!save || typeof save !== 'object') return freshSave();

  if (save.schema < 2) {
    save.badges = save.badges || [];
    save.schema = 2;
  }
  if (save.schema < 3) {
    save.wallet.kindness = save.wallet.kindness || 0;
    save.flags = save.flags || {};
    save.schema = 3;
  }
  if (save.schema < 4) {
    // Spoken prompts arrived in schema 4; default them from the age mode.
    save.settings = save.settings || {};
    if (save.settings.voice === undefined) save.settings.voice = save.difficulty !== 'explorer';
    save.schema = 4;
  }
  if (save.schema < 5) {
    // The Toy Doctor track arrived in schema 5. reconcile() fills in the
    // progress row and the room from the fresh save, so there is nothing to
    // copy here — but an existing player should not have to earn a room that
    // new players are simply given.
    save.unlocked = save.unlocked || {};
    save.unlocked.rooms = [...new Set([...(save.unlocked.rooms || []), 'toyshop'])];
    save.schema = 5;
  }

/** Fill in anything a hand-edited or partial save is missing. */
function reconcile(save) {
  const base = freshSave();
  const merged = { ...base, ...save };
  // Every track in the fresh save gets a progress row, so adding a career
  // never needs a line here again.
  merged.progress = Object.fromEntries(Object.keys(base.progress).map((career) =>
    [career, { ...base.progress[career], ...(save.progress?.[career] || {}) }]));
  merged.wallet = { ...base.wallet, ...(save.wallet || {}) };
  merged.unlocked = {
    tools: [...new Set([...base.unlocked.tools, ...(save.unlocked?.tools || [])])],
    rooms: [...new Set([...base.unlocked.rooms, ...(save.unlocked?.rooms || [])])],
  };
  merged.settings = { ...base.settings, ...(save.settings || {}) };
  merged.purchased = { ...(save.purchased || {}) };
  merged.flags = { ...(save.flags || {}) };
  merged.badges = [...new Set(save.badges || [])];
  merged.schema = SCHEMA; // reconcile() brings everything up to the current shape
  return merged;

 * True when the blob that came out of storage was not already in the current

 * matches what the game is running.

    save.updatedAt = Date.now();
    localStorage.setItem(KEY, JSON.stringify(save));
    return true;
  } catch (err) {
    // Private-browsing / quota. The game must keep playing regardless.
    console.warn('[save] could not write save', err);
    return false;
  }

  try { localStorage.removeItem(KEY); } catch { /* ignore */ }

/**
 * Dead-simple pub/sub. Used for cross-cutting signals (currency changes,
 * unlocks, sound toggles) so screens don't have to know about each other.
 */
const listeners = new Map();

function on(event, fn) {
  if (!listeners.has(event)) listeners.set(event, new Set());
  listeners.get(event).add(fn);
  return () => off(event, fn);
}

function off(event, fn) {
  listeners.get(event)?.delete(fn);
}

function emit(event, payload) {
  listeners.get(event)?.forEach((fn) => {
    try { fn(payload); } catch (err) { console.error(`[events] ${event}`, err); }
  });
}
  Object.assign(__x, { on, off, emit });
});

/**
 * Case registry.
 *
 * Add a new track by importing it here and registering it in TRACKS —
 * nothing else in the game needs to know about it.
 */
const { DOCTOR_CASES } = __req("src/data/cases/doctor.js");
const { VET_CASES } = __req("src/data/cases/vet.js");
const { TOY_CASES } = __req("src/data/cases/toy.js");

const TRACKS = {
  doctor: {
    id: 'doctor', name: 'Doctor', verb: 'Doctor', icon: '🩺',
    blurb: 'Help people feel better.', tint: '#39b5f0',
    room: 'doctor', cases: DOCTOR_CASES,
    previewPatients: ['🧒', '👧', '👦', '🧑', '👶'],
  },
  vet: {
    id: 'vet', name: 'Veterinarian', verb: 'Vet', icon: '🐾',
    blurb: 'Help animals feel better.', tint: '#3fd0a6',
    room: 'vet', cases: VET_CASES,
    previewPatients: ['🐶', '🐱', '🐰', '🐦', '🦊', '🐢'],
  },
  toy: {
    id: 'toy', name: 'Toy Doctor', verb: 'Toy Doctor', icon: '🧸',
    blurb: 'Mend much-loved toys.', tint: '#ff9ec4',
    room: 'toyshop', cases: TOY_CASES,
    previewPatients: ['🧸', '🤖', '🦸', '🪆', '🏎️', '🩰'],
  },
};

const CAREERS = Object.keys(TRACKS);

function getTrack(career) { return TRACKS[career]?.cases || []; }

function getCase(career, level) {
  return getTrack(career).find((c) => c.level === level) || null;
}

function getCaseById(id) {
  for (const career of CAREERS) {
    const found = getTrack(career).find((c) => c.id === id);
    if (found) return found;
  }
  return null;
}

/** Every tool a case will put in the tray (needed tools + decoys). */
function toolsUsedBy(caseDef) {
  const used = new Set();
  for (const step of caseDef.steps) {
    if (step.tool) used.add(step.tool);
    step.decoys?.forEach((d) => used.add(d));
  }
  return [...used];
}

/** Total stars a perfect run of a case can award (steps + completion bonus). */
function maxStarsFor(caseDef) {
  const stepStars = caseDef.steps.reduce((sum, s) => sum + (s.stars || 0), 0);
  const kindness = caseDef.steps.filter((s) => s.type === 'empathy').length;
  return { stepStars, kindness, bonus: caseDef.reward.stars };
}
  Object.assign(__x, { TRACKS, CAREERS, getTrack, getCase, getCaseById, toolsUsedBy, maxStarsFor });
});

/**
 * Tiny WebAudio "instrument".
 *
 * The game ships no audio files on purpose: every sound is synthesised, so
 * there is nothing to download, nothing to 404, and nothing that can blast a
 * child at full volume. The context is created lazily on the first real user
 * gesture, which is also what browsers require.
 */
const { soundOn } = __req("src/core/state.js");

let ctx = null;
let master = null;

function ensure() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.14; // deliberately gentle
  master.connect(ctx.destination);
  return ctx;
}

// Browsers suspend the context until a gesture happens.
['pointerdown', 'keydown', 'touchstart'].forEach((evt) =>
  window.addEventListener(evt, () => { ensure()?.resume?.(); }, { once: true, passive: true })
);

function tone(freq, { dur = 0.16, type = 'sine', at = 0, gain = 1, slideTo = null } = {}) {
  if (!soundOn()) return;
  const c = ensure();
  if (!c || c.state === 'suspended') return;
  const t0 = c.currentTime + at;
  const osc = c.createOscillator();
  const env = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.exponentialRampToValueAtTime(0.55 * gain, t0 + 0.012);
  env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(env).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function noise({ dur = 0.25, gain = 0.5, at = 0, filterFreq = 900 } = {}) {
  if (!soundOn()) return;
  const c = ensure();
  if (!c || c.state === 'suspended') return;
  const t0 = c.currentTime + at;
  const frames = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, frames, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
  const src = c.createBufferSource();
  src.buffer = buf;
  const lp = c.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = filterFreq;
  const env = c.createGain();
  env.gain.value = gain;
  src.connect(lp).connect(env).connect(master);
  src.start(t0);
}

const C5 = 523.25, D5 = 587.33, E5 = 659.25, G5 = 783.99, A5 = 880, C6 = 1046.5, E6 = 1318.5, G6 = 1568;

const sfx = {
  tap:      () => tone(660, { dur: 0.07, type: 'triangle' }),
  select:   () => { tone(E5, { dur: 0.09, type: 'triangle' }); tone(G5, { dur: 0.1, type: 'triangle', at: 0.05 }); },
  pickup:   () => tone(520, { dur: 0.1, type: 'square', gain: 0.5, slideTo: 900 }),
  drop:     () => tone(300, { dur: 0.12, type: 'sine', slideTo: 180 }),
  good:     () => [C5, E5, G5].forEach((f, i) => tone(f, { dur: 0.16, type: 'triangle', at: i * 0.07 })),
  great:    () => [C5, E5, G5, C6].forEach((f, i) => tone(f, { dur: 0.2, type: 'triangle', at: i * 0.075 })),
  fanfare:  () => [C5, E5, G5, C6, E6, G6].forEach((f, i) => tone(f, { dur: 0.32, type: 'triangle', at: i * 0.09, gain: 0.9 })),
  nudge:    () => { tone(430, { dur: 0.13, type: 'sine' }); tone(360, { dur: 0.16, type: 'sine', at: 0.1 }); },
  star:     () => tone(A5, { dur: 0.18, type: 'triangle', slideTo: 1760 }),
  coin:     () => { tone(1180, { dur: 0.06, type: 'square', gain: .6 }); tone(1560, { dur: 0.1, type: 'square', at: 0.05, gain: .6 }); },
  unlock:   () => { noise({ dur: 0.3, filterFreq: 1600, gain: 0.35 }); [D5, G5, C6].forEach((f, i) => tone(f, { dur: 0.26, type: 'triangle', at: 0.1 + i * 0.09 })); },
  heartbeat:() => { tone(88, { dur: 0.13, type: 'sine', gain: 1.5 }); tone(72, { dur: 0.17, type: 'sine', at: 0.19, gain: 1.2 }); },
  breath:   () => noise({ dur: 0.6, filterFreq: 520, gain: 0.28 }),
  woof:     () => tone(300, { dur: 0.16, type: 'sawtooth', gain: .55, slideTo: 170 }),
  meow:     () => tone(620, { dur: 0.4, type: 'sawtooth', gain: .4, slideTo: 900 }),
  chirp:    () => { tone(1500, { dur: 0.08, type: 'sine', slideTo: 2300 }); tone(1800, { dur: 0.08, type: 'sine', at: .11, slideTo: 2600 }); },
  squeak:   () => tone(1100, { dur: 0.1, type: 'triangle', slideTo: 1500 }),

 *

    accessory = 'none', extras = [], mood = 'happy', age = 'child',

  const hc = byId(HAIR_COLORS, hairColor);

<svg viewBox="0 0 200 250" class="lh-charsvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">

    <rect x="90" y="106" width="20" height="18" rx="8" fill="${sk.shade}"/>

      ${acc.includes('headmirror') ? `<circle cx="100" cy="44" r="12" fill="#e8edf7" stroke="#9aa6c4" stroke-width="3"/><circle cx="100" cy="44" r="4" fill="#6B6790"/><path d="M 64 52 q 36 -20 72 0" stroke="#6B6790" stroke-width="5" fill="none"/>` : ''}

  <!-- interaction hotspots (invisible, but findable by the case engine) -->
  <g class="spots" fill="transparent">

    <circle data-spot="ear"   cx="62"  cy="84"  r="16"/>
    <circle data-spot="mouth" cx="100" cy="100" r="16"/>

    <circle data-spot="tummy" cx="100" cy="176" r="24"/>
    <circle data-spot="arm"   cx="56"  cy="160" r="20"/>
    <circle data-spot="hand"  cx="56"  cy="192" r="16"/>
    <circle data-spot="back"  cx="100" cy="150" r="24"/>
    <circle data-spot="knee"  cx="88"  cy="206" r="18"/>
    <circle data-spot="foot"  cx="88"  cy="224" r="16"/>
  </g>
</svg>`;
}

/* ------------------------------------------------------------------ parts */

function labCoat(color) {
  return `
    <path d="M 65 136 q 2 -21 19 -25 l 16 12 l 16 -12 q 17 4 19 25 l 5 57 q -19 6 -28 5 l -2 -53 l -10 8 l -10 -8 l -2 53 q -9 1 -28 -5 z"
