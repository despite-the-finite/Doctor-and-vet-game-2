    <circle cx="90" cy="174" r="2.6" fill="rgba(46,42,68,.22)"/>`;
}

function stethoscope() {
  return `
    <path d="M 84 118 q -10 34 4 48 q 12 12 24 0 q 14 -14 4 -48"
      stroke="#3a4a6b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="172" r="9" fill="#c8d3e8" stroke="#3a4a6b" stroke-width="3"/>`;
}

function cape(mood) {
  return `<path d="M 68 122 q 32 -14 64 0 l 26 96 q -58 16 -116 0 z" fill="#ff5f8d" opacity=".92">
      <animate attributeName="d"
        values="M 68 122 q 32 -14 64 0 l 26 96 q -58 16 -116 0 z;
                M 68 122 q 32 -14 64 0 l 32 94 q -58 20 -122 2 z;
                M 68 122 q 32 -14 64 0 l 26 96 q -58 16 -116 0 z"
        dur="3.4s" repeatCount="indefinite"/>
    </path>`;
}

function freckles() {
  return `<g fill="rgba(150,90,50,.5)">
    <circle cx="-22" cy="10" r="1.8"/><circle cx="-15" cy="14" r="1.6"/><circle cx="-27" cy="16" r="1.5"/>
    <circle cx="22" cy="10" r="1.8"/><circle cx="15" cy="14" r="1.6"/><circle cx="27" cy="16" r="1.5"/>
  </g>`;
}

function glassesSVG(kind) {
  const frame = '#3a4a6b';
  if (kind === 'star') {
    return `<g><text x="-15" y="4" font-size="24" text-anchor="middle">⭐</text>
      <text x="15" y="4" font-size="24" text-anchor="middle">⭐</text>
      <path d="M -5 -2 h 10" stroke="${frame}" stroke-width="3"/></g>`;
  }
  const shape = kind === 'square'
    ? `<rect x="-27" y="-13" width="22" height="20" rx="5" fill="rgba(255,255,255,.35)" stroke="${frame}" stroke-width="3.4"/>
       <rect x="5" y="-13" width="22" height="20" rx="5" fill="rgba(255,255,255,.35)" stroke="${frame}" stroke-width="3.4"/>`
    : `<circle cx="-16" cy="-2" r="12" fill="rgba(255,255,255,.35)" stroke="${frame}" stroke-width="3.4"/>
       <circle cx="16" cy="-2" r="12" fill="rgba(255,255,255,.35)" stroke="${frame}" stroke-width="3.4"/>`;
  return `<g>${shape}<path d="M -5 -2 h 10" stroke="${frame}" stroke-width="3.4"/></g>`;
}

/* ------------------------------------------------------------------- hair */

function hairBack(style, color, r) {
  const cx = HEAD.x, cy = HEAD.y;
  switch (style) {
    case 'long':
      // Two strands falling behind the shoulders — a single slab reads as a
      // cape rather than as hair.
      return `<g fill="${color}">
        <path d="M ${cx - r + 2} ${cy - 14} q -22 12 -20 54 q 2 22 14 22 q 10 0 10 -12 q -8 -30 4 -58 z"/>
        <path d="M ${cx + r - 2} ${cy - 14} q 22 12 20 54 q -2 22 -14 22 q -10 0 -10 -12 q 8 -30 -4 -58 z"/>
        <path d="M ${cx - r - 2} ${cy - 8} a ${r + 2} ${r + 2} 0 0 1 ${(r + 2) * 2} 0 q -6 -30 -${r + 2} -30 q -${r + 2} 0 -${r + 2} 30 z"/>
      </g>`;
    case 'ponytail':
      return `<g fill="${color}">
        <path d="M ${cx + r - 6} ${cy - 12} q 30 8 26 46 q -4 22 -20 18 q 12 -16 4 -36 z"/>
        <circle cx="${cx + r - 2}" cy="${cy - 16}" r="8"/>
      </g>`;
    case 'braids':
      return `<g fill="${color}">
        <path d="M ${cx - r - 2} ${cy - 4} q -14 40 -4 56 q 12 6 16 -6 q -10 -22 -2 -46 z"/>
        <path d="M ${cx + r + 2} ${cy - 4} q 14 40 4 56 q -12 6 -16 -6 q 10 -22 2 -46 z"/>
        <circle cx="${cx - r - 6}" cy="${cy + 54}" r="5" fill="#ff7aa8"/>
        <circle cx="${cx + r + 6}" cy="${cy + 54}" r="5" fill="#ff7aa8"/></g>`;
    case 'afro':
      return `<circle cx="${cx}" cy="${cy - 6}" r="${r + 15}" fill="${color}"/>`;
    case 'hijab':
      // A scarf that drapes onto the shoulders and stops there.
      return `<path d="M ${cx - r - 6} ${cy - 6} q -8 46 6 56 q 40 12 80 0 q 14 -10 6 -56 z" fill="${color}"/>`;
    default:
      return '';
  }
}

function hairFront(style, color, r) {
  const cx = HEAD.x, cy = HEAD.y;
  const cap = (d) => `<path d="${d}" fill="${color}"/>`;
  switch (style) {
    case 'buzz':
      return cap(`M ${cx - r} ${cy - 8} a ${r} ${r} 0 0 1 ${r * 2} 0 q -${r} -14 -${r * 2} 0 z`);
    case 'short':
      return cap(`M ${cx - r - 1} ${cy - 4} a ${r + 1} ${r + 1} 0 0 1 ${(r + 1) * 2} 0 q -10 -26 -${r + 1} -26 q -${r + 1} 0 -${r + 1} 26 z`);
    case 'curly':
      return `<g fill="${color}">
        <circle cx="${cx - 28}" cy="${cy - 24}" r="16"/><circle cx="${cx - 8}" cy="${cy - 34}" r="18"/>
        <circle cx="${cx + 14}" cy="${cy - 30}" r="17"/><circle cx="${cx + 32}" cy="${cy - 14}" r="14"/>
        <circle cx="${cx - 36}" cy="${cy - 6}" r="13"/></g>`;
    case 'bun':
      return `<circle cx="${cx}" cy="${cy - r - 12}" r="16" fill="${color}"/>` +
        cap(`M ${cx - r - 1} ${cy - 6} a ${r + 1} ${r + 1} 0 0 1 ${(r + 1) * 2} 0 q -12 -28 -${r + 1} -28 q -${r + 1} 0 -${r + 1} 28 z`);
    case 'afro':
      return '';
    case 'hijab':
      return `<path d="M ${cx - r - 8} ${cy - 2} q 8 -46 ${r + 8} -46 q ${r + 8} 0 ${r + 8} 46 q -${r + 8} -20 -${(r + 8) * 2} 0 z" fill="${color}"/>`;
    case 'ponytail':
    case 'long':
    case 'braids':
    default:
      return cap(`M ${cx - r - 1} ${cy - 2} a ${r + 1} ${r + 1} 0 0 1 ${(r + 1) * 2} 0 q -8 -30 -${r + 1} -30 q -${r + 1} 0 -${r + 1} 30 z`);
  }
}

/**
 * Shared face parts for every character in the game (heroes, kids, puppies,
 * owls…). Keeping eyes and mouths in one place means a new mood instantly
 * works on every species.
 *
 * All parts are drawn around an origin at the centre of the face, so callers
 * just translate to wherever the head is.
 *
 * The twelve expressions come from the design's expression sheet, which draws
 * them in an 80x80 box on a face of r=34 with the eyes at x=29 and x=51.
 * Here every measurement is expressed as a fraction of the caller's eye
 * spread instead, so one table of moods fits a human, an animal and a toy
 * without a special case anywhere.
 */

const MOODS = [
  'happy', 'calm', 'sad', 'scared', 'sick', 'sleepy',
  'giggle', 'surprised', 'love', 'proud', 'confused', 'itchy',
];

const INK = '#2E2A44';
const MUTE = '#8C86AD';       /* the ? and Z glyphs */
const BLUSH = '#FF9EB0';
const BLUSH_STRONG = '#FF8095';
const TEAR = '#7ED0FF';
const HEART = '#FF5F8D';
const STAR = '#FFD84D';
const STAR_EDGE = '#E0AE12';
const ITCH = '#E8556D';

/** The face fill a mood asks for. Only `sick` changes it — it goes sallow. */
function faceTint(mood, base) {
  return mood === 'sick' ? '#EDD9B4' : base;
}

/** Eyes for a mood. `w` is the horizontal spread. */
function eyes(mood, { w = 15, y = 0, color = INK, scale = 1 } = {}) {
  const L = -w, R = w;
  const sw = 3.2 * scale;
  /* Proportions lifted from the sheet: an eye arc spans 0.64 of the spread
     either side and rises 0.73 of it; a round eye is 0.455 of it across. */
  const half = 0.64 * w;
  const rise = 0.73 * w;
  const rx = 0.455 * w * scale;

  /* An open, lidded eye — round pupil with a highlight up and to the right. */
  const dot = (x, ry = rx) => `
    <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${color}"/>
    <circle cx="${x + rx * 0.4}" cy="${y - ry * 0.4}" r="${rx * 0.36}" fill="#fff"/>`;

  /* A closed, happy eye. dir 1 arches up, dir -1 droops. */
  const arc = (x, dir = 1) =>
    `<path d="M ${x - half} ${y + rise * 0.25 * dir} q ${half} ${-rise * dir} ${half * 2} 0"
       fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;

  switch (mood) {
    case 'happy':
      return arc(L) + arc(R);
    case 'proud':
      return arc(L) + arc(R);
    case 'giggle':
      return arc(L) + arc(R);
    case 'itchy':
      /* squeezed a little tighter than happy — the scrunch of a good scratch */
      return arc(L, 1.12) + arc(R, 1.12);
    case 'love':
      return heartEye(L, y, w) + heartEye(R, y, w);
    case 'sleepy':
      return arc(L, -1) + arc(R, -1);
    case 'sad':
      return dot(L, rx * 1.2) + dot(R, rx * 1.2) + tear(R + w * 0.64, y + w * 1.1, w);
    case 'scared':
      return dot(L, rx * 1.4) + dot(R, rx * 1.4) +
        `<path d="M ${L - w * 0.82} ${y - w * 1.18} q ${w * 0.73} ${-w * 0.45} ${w * 1.36} ${-w * 0.18}"
           fill="none" stroke="${color}" stroke-width="${2.8 * scale}" stroke-linecap="round"/>
         <path d="M ${R + w * 0.82} ${y - w * 1.18} q ${-w * 0.73} ${-w * 0.45} ${-w * 1.36} ${-w * 0.18}"
           fill="none" stroke="${color}" stroke-width="${2.8 * scale}" stroke-linecap="round"/>`;
    case 'sick':
      return crossEye(L, y, w, color, sw) + crossEye(R, y, w, color, sw);
    case 'surprised':
      return dot(L, rx * 1.5) + dot(R, rx * 1.5);
    case 'confused':
      return arc(L) + dot(R, rx * 1.2);
    default: // calm
      return dot(L) + dot(R);
  }
}

/** The X of a poorly patient's eye. */
function crossEye(x, y, w, color, sw) {
  const a = w * 0.55;
  return `<path d="M ${x - a} ${y - a * 0.8} l ${a * 2} ${a * 1.6} M ${x + a} ${y - a * 0.8} l ${-a * 2} ${a * 1.6}"
    stroke="${color}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
}

function heartEye(x, y, w) {
  const s = w / 11;   /* the sheet draws this heart against a spread of 11 */
  return `<path d="M ${x} ${y + 3 * s}
    C ${x - 8 * s} ${y - 5 * s} ${x - 6 * s} ${y - 12 * s} ${x} ${y - 8 * s}
    C ${x + 6 * s} ${y - 12 * s} ${x + 8 * s} ${y - 5 * s} ${x} ${y + 3 * s} Z" fill="${HEART}"/>`;
}

function tear(x, y, w) {
  const rx = w * 0.31, ry = w * 0.45;
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${TEAR}">
    <animate attributeName="cy" values="${y};${y + ry * 2.8};${y}" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>`;
}

/** Mouth for a mood. */
function mouth(mood, { y = 20, color = INK, scale = 1 } = {}) {
  const sw = 3.2 * scale;
  const s = scale;
  const line = (d) => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;

  switch (mood) {
    case 'happy':
      return line(`M ${-11 * s} ${y} q ${11 * s} ${10 * s} ${22 * s} 0`);
    case 'proud':
      return line(`M ${-9 * s} ${y} q ${9 * s} ${11 * s} ${18 * s} 0`);
    case 'love':
      return line(`M ${-9 * s} ${y} q ${9 * s} ${11 * s} ${18 * s} 0`);
    case 'giggle':
      /* open laugh, with a tongue behind it */
      return `<path d="M ${-12 * s} ${y - 3 * s} q ${12 * s} ${16 * s} ${24 * s} 0 z" fill="${color}"/>
              <path d="M ${-6 * s} ${y + 3 * s} q ${6 * s} ${6 * s} ${12 * s} 0 z" fill="#FF8FA6"/>`;
    case 'sad':
      return line(`M ${-8 * s} ${y + 5 * s} q ${8 * s} ${-7 * s} ${16 * s} 0`);
    case 'scared':
      return `<ellipse cx="0" cy="${y + 5 * s}" rx="${6 * s}" ry="${7.5 * s}" fill="${color}"/>`;
    case 'sick':
      /* the queasy wave */
      return line(`M ${-11 * s} ${y + 5 * s} q ${5.5 * s} ${-8 * s} ${11 * s} 0 q ${5.5 * s} ${8 * s} ${11 * s} 0`);
    case 'sleepy':
      return `<ellipse cx="0" cy="${y + 3 * s}" rx="${5 * s}" ry="${6 * s}" fill="${color}" opacity=".85"/>`;
    case 'surprised':
      return `<ellipse cx="0" cy="${y + 4 * s}" rx="${6 * s}" ry="${7 * s}" fill="${color}"/>`;
    case 'confused':
      /* one corner up, one down */
      return line(`M ${-9 * s} ${y + 2 * s} q ${9 * s} ${6 * s} ${18 * s} ${-3 * s}`);
    case 'itchy':
      return line(`M ${-9 * s} ${y + 3 * s} q ${9 * s} ${-7 * s} ${18 * s} ${3 * s}`);
    default: // calm
      return line(`M ${-8 * s} ${y + 1 * s} q ${8 * s} ${6 * s} ${16 * s} 0`);
  }
}

/** Rosy cheeks — the single biggest "cute" lever there is. */
function blush(mood, { w = 30, y = 14, color = BLUSH, opacity = 0.55 } = {}) {
  /* Moods that run hot get a deeper, wider flush. */
  const strong = mood === 'sick' || mood === 'love' || mood === 'giggle';
  const fill = strong ? BLUSH_STRONG : color;
  const op = strong ? 0.8 : opacity;
  const rx = w * (strong ? 0.28 : 0.245), ry = w * (strong ? 0.19 : 0.175);
  const cheek = (x) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" opacity="${op}"/>`;
  /* sad and scared faces drain rather than flush */
  if (mood === 'sad' || mood === 'scared' || mood === 'surprised') return '';
  return cheek(-w) + cheek(w);
}

/**
 * The little drawn mark a mood wears beside the head — the sleeper's Z, the
 * puzzled ?, the proud star, the itch marks, the giggle's sparkles. Drawn,
 * never typed: there is no emoji anywhere in the rendered game.
 */
function moodAura(mood, { y = -70, x = 24, scale = 1 } = {}) {
  const s = scale;
  switch (mood) {
    case 'sleepy':
      return `<path d="M ${x} ${y} h ${9 * s} l ${-9 * s} ${8 * s} h ${9 * s}"
        fill="none" stroke="${MUTE}" stroke-width="${2.6 * s}" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>`;
    case 'confused':
      return `<path d="M ${x} ${y + 2 * s} q ${7 * s} ${-4 * s} ${7 * s} ${3 * s} t ${-6 * s} ${4 * s} v ${3 * s}"
        fill="none" stroke="${MUTE}" stroke-width="${2.8 * s}" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="2.8s" repeatCount="indefinite"/>
      </path>`;
    case 'proud':
      return star(0, y, 7 * s);
    case 'itchy':
      return `<path d="M ${x} ${y + 6 * s} l ${6 * s} ${-6 * s} M ${x} ${y + 14 * s} h ${8 * s} M ${x - 2 * s} ${y} l ${3 * s} ${-7 * s}"
        stroke="${ITCH}" stroke-width="${2.8 * s}" stroke-linecap="round" fill="none"/>`;
    case 'giggle':
      return twinkle(-x - 4 * s, y + 4 * s, 2.4 * s, '1.8s') + twinkle(x + 4 * s, y, 2.4 * s, '2.2s');
    case 'love':
      return `<path d="M ${x} ${y + 8 * s} c ${-6 * s} ${-8 * s} ${-4 * s} ${-14 * s} ${0} ${-9 * s}
        c ${4 * s} ${-5 * s} ${6 * s} ${1 * s} ${0} ${9 * s} z" fill="${HEART}" opacity=".9">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>`;
    default:
      return '';
  }
}

__def("src/ui/parts.js", function (__x, __req) {
/**
 * Shared SVG primitives.
 *
 * One proportion rule holds across all three worlds: big head, soft body, no
 * visible foot detail. Everything drawn in the game is assembled from the
 * pieces below, so a human, an animal and a toy are the same figure with
 * different parts bolted on.
 *
 * Reference viewBoxes: humans `0 0 120 190`, animals and toys `0 0 130 190`.
 * Outlines are always a darker tint of the fill — never black, never grey.
 */

const INK = '#2E2A44';

/** Read a hex colour, long or short form, as [r, g, b]. */
function rgb(c) {
  let h = c.replace('#', '');
  if (h.length === 3) h = h.split('').map((v) => v + v).join('');
  return h.match(/../g).map((v) => parseInt(v, 16));
}

const hex2 = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');

/** Mix two hex colours. `t` of 0 keeps `a`, 1 gives `b`. */
function mix(a, b, t) {
  const [r1, g1, b1] = rgb(a);
  const [r2, g2, b2] = rgb(b);
  const ch = (x, y) => hex2(x + (y - x) * t);
  return `#${ch(r1, r2)}${ch(g1, g2)}${ch(b1, b2)}`;
}

/**
 * The outline for a fill: the same hue, taken darker.
 *
 * Mixing toward ink would drain the colour to grey, and the design is
 * explicit that an outline is a darker tint of its fill — never black,
 * never grey. So darken in HSL and leave the hue where it is.
 */
function outline(fill, amount = 0.34) {
  const [r, g, b] = rgb(fill).map((v) => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  const d = max - min;
  let hue = 0;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d !== 0) {
    if (max === r) hue = ((g - b) / d) % 6;
    else if (max === g) hue = (b - r) / d + 2;
    else hue = (r - g) / d + 4;
    hue *= 60;
    if (hue < 0) hue += 360;
  }
  /* A near-neutral fill has no hue to darken into, and the design never
     wants a grey line, so it takes the warm ink-violet instead. */
  if (s < 0.08) return mix(fill, '#8C86AD', amount + 0.12);
  /* Calibrated against the design's own pair: fur #F7DDBB is outlined
     #C29061 — lightness down about a third, saturation down a little more. */
  const l2 = l * (1 - amount);
  const s2 = Math.max(0, s * (1 - amount * 1.2));
  const c = (1 - Math.abs(2 * l2 - 1)) * s2;
  const x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
  const m = l2 - c / 2;
  const [rr, gg, bb] = hue < 60 ? [c, x, 0] : hue < 120 ? [x, c, 0] : hue < 180 ? [0, c, x]
    : hue < 240 ? [0, x, c] : hue < 300 ? [x, 0, c] : [c, 0, x];
  return `#${hex2((rr + m) * 255)}${hex2((gg + m) * 255)}${hex2((bb + m) * 255)}`;
}

__def("src/ui/screens/hub.js", function (__x, __req) {
/**
 * The hospital hub — an illustrated cutaway building.
 *
 * Locked rooms are visible on purpose ("what's behind that door?"), and when
 * one unlocks it gets a little construction animation before the room itself
 * appears. Purchased decorations are drawn straight into the rooms so every
 * upgrade is immediately, obviously visible.
 */
const { h, wait } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");
const { go } = __req("src/core/router.js");
const { getState, hasRoom, careerCompletion, isCareerFinished, heroTitle } = __req("src/core/state.js");
const { FLOORS, ROOMS } = __req("src/data/rooms.js");
const { placedItemsFor } = __req("src/data/shop.js");
const { TRACKS, CAREERS } = __req("src/data/cases/index.js");
const { hud, heroSVG, modal } = __req("src/ui/components.js");
const { confetti, sparkle, toast, flash } = __req("src/core/fx.js");

function hubScreen({ build = null, highlight = null } = {}) {
  const state = getState();

  const el = h('div', { class: 'lh-screen lh-screen--hub', 'data-world': 'doctor' });
  const bar = hud({ title: 'My Hospital', chips: ['stars', 'kindness', 'coins'], dark: true });
  el.appendChild(bar);

  const scroll = h('div', { class: 'lh-screen__scroll hub-scroll' });
  el.appendChild(scroll);

  /* ------------------------------------------------------- hero + status */
  // One line per track, built from the registry so a new career shows up here
  // without anybody remembering to add it.
  const trackLine = CAREERS
    .map((id) => {
      const { done, total } = careerCompletion(id);
      return `${TRACKS[id].icon} ${TRACKS[id].verb} ${done}/${total}`;
    })
    .join('   •   ');

  scroll.appendChild(h('div', { class: 'hub-hero' },
    h('div', { class: 'hub-hero__art', html: heroSVG({ mood: 'happy' }) }),
    h('div', { class: 'hub-hero__text' },
      h('h3', {}, heroTitle()),
      h('p', {}, trackLine)),
    h('button', { class: 'lh-btn lh-btn--icon', 'aria-label': 'Change my hero', onClick: () => go('creator') }, '🎨')));

  /* ------------------------------------------------------------ building */
  const building = h('div', { class: 'building-wrap' });
  building.appendChild(h('div', { class: 'roof-cap' }, 'LITTLE HEROES HOSPITAL'));

  FLOORS.forEach((floorDef) => {
    const floor = h('div', { class: `floor floor--${floorDef.rooms.length}` });
    floorDef.rooms.forEach((id) => floor.appendChild(roomTile(ROOMS[id], id === highlight)));
    building.appendChild(floor);
  });

  building.appendChild(h('div', { class: 'hub-ground' }));
  scroll.appendChild(building);

  /* ------------------------------------------------------------ actions */
  scroll.appendChild(h('div', { class: 'hub-actions' },
    h('button', { class: 'lh-btn lh-btn--quiet', onClick: () => go('bag') }, '🎒 Doctor Bag'),
    h('button', { class: 'lh-btn lh-btn--quiet', onClick: () => go('shop') }, '🛒 Supply Room')));

  if (CAREERS.every(isCareerFinished)) {
    scroll.appendChild(h('p', { class: 'empty-note' },
      '🏆 You have helped every single patient. You are a true Little Hero!'));
  }

  /* --------------------------------------------------------- room tiles */
  function roomTile(room, isHighlight) {
    const unlocked = hasRoom(room.id);
    const tile = h('button', {
      class: `room${unlocked ? '' : ' room--locked'}${room.roof ? ' room--roof' : ''}`,
      style: { '--tint': room.tint, '--wall': room.wall },
      dataset: { room: room.id },
      'aria-label': unlocked ? room.name : `${room.name} — locked`,
      onClick: () => openRoom(room, unlocked),
    });

    tile.appendChild(h('div', { class: 'room__wall' }));
    tile.appendChild(h('div', { class: 'room__floorline' }));

    if (unlocked) {
      const props = [...(room.props || []), ...placedItemsFor(room.id, state.purchased).map((i) => ({
        emoji: i.icon, x: i.place.x, y: i.place.y, size: i.place.size, anim: i.place.anim,
      }))];
      props.forEach((p) => {
        tile.appendChild(h('span', {
          class: `room__prop${p.anim ? ` ${p.anim}` : ''}`,
          style: {
            left: `${p.x}%`, top: `${p.y}%`, fontSize: `${p.size || 26}px`,
            animation: p.anim ? `${p.anim} ${3 + Math.random() * 2}s ease-in-out infinite` : '',
          },
        }, p.emoji));
      });

      tile.appendChild(h('div', { class: 'room__label' }, h('span', {}, room.icon), h('span', {}, room.name)));

      if (room.action?.startsWith('levels:')) {
        const career = room.action.split(':')[1];
        const { done, total } = careerCompletion(career);
        tile.appendChild(h('div', { class: 'room__count' }, `⭐ ${done}/${total}`));
      }
      tile.appendChild(h('div', { class: 'room__go' }, room.action === 'shop' ? '🛒' : room.action === 'bag' ? '🎒' : '👉'));
    } else {
      tile.appendChild(h('div', { class: 'room__lock' },
        h('div', { class: 'room__lock-icon' }, '🔒'),
        h('div', { class: 'room__lock-name' }, room.name),
        h('div', { class: 'room__lock-how' }, room.unlock?.text || 'Keep helping patients!')));
    }

    if (isHighlight) {
      tile.classList.add('lh-case--next');
      setTimeout(() => tile.scrollIntoView({ behavior: 'smooth', block: 'center' }), 260);
    }
    return tile;
  }

  function openRoom(room, unlocked) {
    sfx.tap();
    if (!unlocked) {
      sfx.nudge();
      toast(room.unlock?.text || 'Help more patients to open this room!', { icon: '🔒' });
      return;
    }
    if (room.action === 'shop') return go('shop');
    if (room.action === 'bag') return go('bag');
    if (room.action?.startsWith('levels:')) return go('levels', { career: room.action.split(':')[1] });
    showRoomInfo(room);
  }

  function showRoomInfo(room) {
    const usedBy = Object.values(TRACKS)
      .flatMap((t) => t.cases.filter((c) => c.room === room.id).map((c) => `${t.icon} ${c.title}`));
    modal([
      h('div', { style: { fontSize: '62px' } }, room.icon),
      h('h2', {}, room.name),
      h('p', {}, room.blurb),
      usedBy.length ? h('div', { class: 'unlock-strip' },
        ...usedBy.slice(0, 4).map((u) => h('span', { class: 'unlock-chip' }, u))) : null,
      h('button', { class: 'lh-btn lh-btn--secondary', onClick: () => document.querySelector('.lh-modal__veil')?.remove() }, 'Nice! 👍'),
    ]);
  }

  /* ------------------------------------------- construction celebration */
  async function playConstruction(roomIds) {
    for (const id of roomIds) {
      const tile = building.querySelector(`[data-room="${id}"]`);
      if (!tile) continue;
      tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const site = h('div', { class: 'construction' }, h('span', {}, '🚧'));
      tile.appendChild(site);
      sfx.build();
      await wait(500);
      site.firstChild.textContent = '🔨';
      await wait(500);
      site.firstChild.textContent = '🏗️';
      await wait(500);
      site.remove();
      flash('rgba(255,255,255,.6)', 400);
      sfx.unlock();
      sparkle(tile, { count: 20 });
      confetti({ intensity: 0.8, duration: 2000 });
      toast(`${ROOMS[id].icon} ${ROOMS[id].name} is open!`, { icon: '🎉', tone: 'good', ms: 3200 });
      await wait(900);
    }
  }

  return {
    el,
    onEnter() { if (build?.length) playConstruction(build); },
    destroy: () => bar.dispose?.(),
  };
}
  Object.assign(__x, { hubScreen });
});

__def("src/ui/patients.js", function (__x, __req) {
/**
 * Patient factory — turns the `patient` block of a case into a DOM element.
 *
 * A patient is just data:
 *   { kind: 'human' | <species>, name, look: {...}, voice }
 * so a new patient never needs new rendering code.
 */
const { humanSVG } = __req("src/ui/human.js");
const { creatureSVG, SPECIES } = __req("src/ui/creature.js");
const { toySVG, TOYS, isToy } = __req("src/ui/toy.js");
const { raw } = __req("src/core/dom.js");

function patientMarkup(patient, mood = 'happy') {
  if (patient.kind === 'human') {
    return humanSVG({ ...(patient.look || {}), mood });
  }
  // Toys come in five body plans — plush, action figure, robot, doll and car —
  // so they route through their own renderer rather than the animal one.
  if (isToy(patient.kind)) {
    return toySVG({ kind: patient.kind, mood, ...(patient.look || {}) });
  }
  return creatureSVG({ species: patient.kind, mood, ...(patient.look || {}) });
}

function patientElement(patient, mood = 'happy') {
  const el = raw(patientMarkup(patient, mood), 'patient-art');
  el.dataset.kind = patient.kind;
  return el;
}

/** Swap the artwork in-place when a mood changes, keeping the wrapper. */
function setMood(el, patient, mood) {
  el.innerHTML = patientMarkup(patient, mood);
  el.dataset.mood = mood;
}

/** The noise this patient makes — used for reactions. */
function patientSound(patient) {
  if (patient.kind === 'human') return 'squeak';
  if (isToy(patient.kind)) return TOYS[patient.kind].sound || 'squeak';
  return SPECIES[patient.kind]?.sound || 'squeak';
}

function patientEmoji(patient) {
  if (patient.kind === 'human') return patient.emoji || '🧒';
  if (isToy(patient.kind)) return TOYS[patient.kind].emoji || '🧸';
  return SPECIES[patient.kind]?.emoji || '🐾';
}
  Object.assign(__x, { patientMarkup, patientElement, setMood, patientSound, patientEmoji });
});

/**
 * What makes a toy look like a toy: a stitched seam down the middle and a

 * runs into the body rather than across the face.

function toySeam(s) {

    <path d="M 100 132 V 228" stroke="rgba(0,0,0,.16)" stroke-width="2" stroke-dasharray="5 6" fill="none"/>

    </g>
  </g>`;
}

/** Sewn-on buttons, with the little cross of thread through the middle. */
function buttonEyes(mood, s) {
  const shut = mood === 'sleepy' || mood === 'sad';
  const r = s.bigEyes ? 15 : 11;
  const eye = (cx) => (shut
    ? `<path d="M ${cx - r} -4 q ${r} 8 ${r * 2} 0" stroke="#3a2f2a" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : `<g>

        <circle cx="${cx}" cy="-4" r="${r}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.4"/>
        <circle cx="${cx}" cy="-4" r="${r * 0.72}" fill="#3a2f2a"/>

          <circle cx="${cx - 2.6}" cy="-6.6" r="1.3"/><circle cx="${cx + 2.6}" cy="-6.6" r="1.3"/>

function yarnHair(s, hy, hr) {

function snout(s, mood) {
  if (s.snout === 'beak') {
    return `<path d="M -13 12 l 13 20 l 13 -20 q -13 6 -26 0 z" fill="${s.nose}"/>
            <path d="M -11 13 q 11 5 22 0" stroke="rgba(0,0,0,.2)" stroke-width="1.6" fill="none"/>`;

    : `<ellipse cx="-9" cy="22" rx="12" ry="9" fill="${s.belly}"/><ellipse cx="9" cy="22" rx="12" ry="9" fill="${s.belly}"/>`;

    : `<path d="M -7 8 l 14 0 l -7 8 z" fill="${s.nose}"/>`;

    ? `<g stroke="rgba(60,60,80,.35)" stroke-width="1.8" stroke-linecap="round">
        <path d="M -18 20 l -18 -4"/><path d="M -18 24 l -18 4"/>
        <path d="M 18 20 l 18 -4"/><path d="M 18 24 l 18 4"/></g>` : '';

    case 'feather':

  }
}

function wings(s) {
  return `<g>
    <ellipse cx="52" cy="180" rx="18" ry="34" fill="${shade(s.fur)}" class="lh-wing--l" style="transform-origin:60px 156px"/>
    <ellipse cx="148" cy="180" rx="18" ry="34" fill="${shade(s.fur)}" class="lh-wing--r" style="transform-origin:140px 156px"/>

function shell(s) {

    <ellipse cx="100" cy="172" rx="58" ry="48" fill="${s.shell}"/>
    <ellipse cx="100" cy="172" rx="44" ry="36" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4"/>

function antlers(hy, hr) {

    <path d="M 76 ${hy - hr + 6} l -12 -30 m 0 0 l -14 6 m 14 -6 l 4 -16"/>
    <path d="M 124 ${hy - hr + 6} l 12 -30 m 0 0 l 14 6 m -14 -6 l -4 -16"/>

/** Slightly darker variant of a fur colour for ears / tails. */
function shade(hex) {
  if (!hex?.startsWith('#')) return hex;
  const n = parseInt(hex.slice(1), 16);
  const d = (v) => Math.max(0, Math.round(v * 0.86));
  const r = d((n >> 16) & 255), g = d((n >> 8) & 255), b = d(n & 255);
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

__def("src/ui/screens/casescreen.js", function (__x, __req) {
/**
 * Thin screen wrapper around the case engine.
 *
 * Its only jobs: find the case, mount the runner, and turn the runner's
 * result into save-file changes (stars, coins, unlocks, badges) before
 * handing over to the results screen.
 */
const { h } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");
const { go, goHome } = __req("src/core/router.js");
const { addStars, addKindness, addCoins, completeCase, unlockTool, unlockRoom, awardBadge, hasTool, hasRoom, isLevelCompleted } = __req("src/core/state.js");
const { getCaseById } = __req("src/data/cases/index.js");
const { createCaseRunner } = __req("src/engine/caseRunner.js");
const { hud, modal } = __req("src/ui/components.js");

function caseScreen({ career, caseId }) {
  const caseDef = getCaseById(caseId);
  const el = h('div', { class: 'lh-screen', 'data-world': career });

  if (!caseDef) {
    el.appendChild(h('p', { class: 'empty-note' }, 'That patient could not be found.'));
    el.appendChild(h('button', { class: 'lh-btn', onClick: () => goHome('hub') }, 'Back to my hospital'));
    return { el };
  }

  const replay = isLevelCompleted(career, caseDef.id);

  const bar = hud({
    title: `${caseDef.icon} ${caseDef.title}`,
    back: confirmQuit,
    dark: true,
    chips: [],
  });
  el.appendChild(bar);

  const runner = createCaseRunner(caseDef, { onFinish });
  el.appendChild(runner.el);

  function confirmQuit() {
    const m = modal([
      h('div', { style: { fontSize: '54px' } }, '🚪'),
      h('h2', {}, 'Leave this patient?'),
      h('p', {}, 'You can come back and start them again any time.'),
      h('div', { class: 'lh-row lh-gap-m', style: { justifyContent: 'center', flexWrap: 'wrap' } },
        h('button', { class: 'lh-btn lh-btn--primary', onClick: () => m.close() }, 'Keep helping'),
        h('button', { class: 'lh-btn lh-btn--quiet', onClick: () => { m.close(); goHome('hub'); } }, 'Leave')),
    ]);
  }

  function onFinish(result) {
    // Replays are worth fewer coins so the shop still means something,
    // but stars and kindness always count — practice should never be punished.
    const coinMultiplier = replay ? 0.3 : 1;
    const coins = Math.round(result.coins * coinMultiplier);

    addStars(result.stars);
    addKindness(result.kindness);
    addCoins(coins);

    const newTools = (caseDef.unlocks?.tools || []).filter((t) => !hasTool(t));
    const newRooms = (caseDef.unlocks?.rooms || []).filter((r) => !hasRoom(r));
    newTools.forEach(unlockTool);
    newRooms.forEach(unlockRoom);
    result.badges.forEach(awardBadge);

    const progress = completeCase(career, caseDef);

    sfx.great();
    go('results', {
      career, caseDef, result: { ...result, coins },
      newTools, newRooms, progress, replay,
    }, { replace: true });
  }

  return { el, destroy: () => { runner.destroy(); bar.dispose?.(); } };
}
  Object.assign(__x, { caseScreen });
});

__def("src/engine/caseRunner.js", function (__x, __req) {
/**
 * The case runner.
 *
 * Walks the `steps` array of a case, handing each step to the matching module
 * in ./steps. The runner owns the stage (backdrop, patient, speech bubbles,
 * the reward tally) and gives step modules a small, stable context object —
 * so a new step type is a new file plus one line in ./steps/index.js.
 */
const { h, clear, wait, pick } = __req("src/core/dom.js");
const { sfx, play } = __req("src/core/audio.js");
const { confetti, sparkle, floatText, hearts, toast, flash } = __req("src/core/fx.js");
const { backdrop } = __req("src/ui/backdrop.js");
const { patientElement, setMood, patientSound, patientEmoji } = __req("src/ui/patients.js");
const { TOYS, isToy } = __req("src/ui/toy.js");
const { isLittle } = __req("src/core/state.js");
const { fill } = __req("src/engine/text.js");
const { say: speak, sayAll, whenDone: speechDone, stop: stopSpeaking } = __req("src/core/voice.js");
const { STEP_RUNNERS } = __req("src/engine/steps/index.js");

/** What {species} reads as in a case's text. */
function speciesLabelFor(patient) {
  if (patient.kind === 'human') return 'child';
  if (isToy(patient.kind)) return TOY_LABELS[TOYS[patient.kind].family] || 'toy';
  return patient.kind;
}

const TOY_LABELS = {
  plush: 'soft toy', figure: 'action figure', robot: 'robot', doll: 'doll', car: 'toy car',
};

function createCaseRunner(caseDef, { onFinish, onQuit }) {
  /* --- resolve the patient (some cases pick from a pool at random) ------ */
  const chosen = caseDef.patientPool ? pick(caseDef.patientPool) : caseDef.patient;
  const patient = {
    ...chosen,
    speciesLabel: speciesLabelFor(chosen),
    // patientEmoji knows about people, animals and all five toy families —
    // looking it up in SPECIES alone left every robot and toy car labelled 🧒.
    emoji: chosen.emoji || patientEmoji(chosen),
  };

  /* --- running tally ---------------------------------------------------- */
  const tally = { stars: 0, kindness: 0, coins: 0, mistakes: 0, badges: [] };

  /* --- DOM -------------------------------------------------------------- */
  const stage = h('div', { class: 'case-stage' });
  stage.appendChild(backdrop(caseDef.room));

  const patientWrap = h('div', { class: 'case-patient' });
  const patientEl = patientElement(patient, caseDef.steps[0]?.mood || 'happy');
  patientWrap.appendChild(patientEl);

  const overlay = h('div', { class: 'case-overlay' });
  const bubbleLane = h('div', { class: 'lh-bubble-lane' });
  const scene = h('div', { class: 'case-scene' }, patientWrap, overlay, bubbleLane);
  stage.appendChild(scene);

  const nameTag = h('div', { class: 'case-nametag' },
    h('span', { class: 'case-nametag__emoji' }, patient.emoji),
    h('span', {}, patient.name));
  stage.appendChild(nameTag);

  const promptEl = h('div', { class: 'panel__prompt' });
  const bodyEl = h('div', { class: 'panel__body' });
  const teachEl = h('div', { class: 'panel__teach lh-hidden' });
  const panel = h('div', { class: 'case-panel' }, promptEl, bodyEl, teachEl);

  const dots = h('div', { class: 'case-dots' });
  caseDef.steps.forEach(() => dots.appendChild(h('i')));

  const el = h('div', { class: 'case-root' }, stage, dots, panel);

  /* --- helpers handed to step modules ---------------------------------- */
  let index = 0;
  let cleanupStep = null;
  let destroyed = false;

  function say(who, text, { translate = null, mood = null, sfxName = null, hold = false } = {}) {
    const spoken = fill(text, patient);
    const bubble = h('div', { class: `lh-bubble lh-bubble--${who}` }, spoken);
    // Animal patients get their line then the translation. Join them without
    // doubling punctuation — "Woof!." is a stumble when it is read aloud.
    speak(translate ? `${spoken.replace(/[\s.]+$/, '')}. ${fill(translate, patient)}` : spoken);
    if (who === 'narrator' || who === 'nurse') bubble.classList.add('lh-bubble--thought');
    bubbleLane.appendChild(bubble);
    if (translate) {
      bubbleLane.appendChild(h('div', { class: 'lh-bubble lh-bubble--translate' },
        h('span', { class: 'lh-bubble__tkey' }, '🗣️ '), fill(translate, patient)));
    }
    if (mood) setPatientMood(mood);
    if (sfxName) play(sfxName);
    // Keep the lane readable — only the current line and the one before it.
    while (bubbleLane.children.length > 2) bubbleLane.firstChild.remove();
    if (!hold) setTimeout(() => bubble.classList.add('lh-bubble--settled'), 40);
    return bubble;
  }

  function clearBubbles() { clear(bubbleLane); }

  function setPatientMood(mood) { setMood(patientEl, patient, mood); }

  function react(kind = 'happy') {
    patientEl.classList.remove('lh-react--happy', 'lh-react--wiggle', 'lh-react--shy');
    void patientEl.offsetWidth; // restart the animation
    patientEl.classList.add(`lh-react--${kind}`);
  }

  function hotspot(name) {
    return patientEl.querySelector(`[data-spot="${name}"]`);
  }

  function award({ stars = 0, kindness = 0, coins = 0 }, from = null) {
    if (stars) {
      tally.stars += stars;
      floatText(from || patientWrap, `+${stars} ⭐`, '#ffd75e');
      sparkle(from || patientWrap, { count: 8 + stars * 2 });
      sfx.star();
    }
    if (kindness) {
      tally.kindness += kindness;
      floatText(from || patientWrap, `+${kindness} ❤️`, '#ff8fa6');
      hearts(from || patientWrap, 7);
    }
    if (coins) {
      tally.coins += coins;
      floatText(from || patientWrap, `+${coins} 🪙`, '#ffd75e');
      sfx.coin();
    }
    renderTally();
  }

  function teach(text) {
    if (!text) { teachEl.classList.add('lh-hidden'); return; }
    // Younger players get the fun fact; explorers get it too, with vocabulary.
    teachEl.innerHTML = `<span class="panel__teach-icon">💡</span><span>${fill(text, patient)}</span>`;
    teachEl.classList.remove('lh-hidden');
    // Read it out — it is the one line in the step actually worth teaching,
    // and a child who cannot read was previously getting nothing from it.
    speak(fill(text, patient));
  }

  /**
   * Read the answers aloud.
   *
   * A child who cannot read can see the icons but has no idea what any option
   * says, which turns every question into a guess. Saying them in order —
   * "You can pick: a bandage. Or: a plaster." — is what makes the choice a
   * real one. The labels are spoken after the prompt, so the queue keeps them
   * in the order they appear on screen.
   */
  function speakOptions(labels, { lead = 'You can pick:' } = {}) {
    const clean = labels.map((l) => fill(String(l), patient)).filter(Boolean);
    if (!clean.length) return;
    sayAll([lead, ...clean.map((l, i) => (i === 0 ? l : `Or: ${l}`))]);
  }

  function noteMistake() { tally.mistakes++; }

  function setPrompt(text, sub = null, { spoken = true } = {}) {
    clear(promptEl);
    if (!text) return;
    if (spoken) speak(fill(text, patient));
    promptEl.appendChild(h('div', { class: 'panel__prompt-main' }, fill(text, patient)));
    if (sub) promptEl.appendChild(h('div', { class: 'panel__prompt-sub' }, fill(sub, patient)));
  }

  /**
   * The "Next" button every step ends with. Centralised so it always looks
   * the same and always scrolls itself into view — on a phone the panel is
   * short and a freshly appended button can otherwise sit below the fold.
   */
  function continueButton(label = 'Next 👉', host = bodyEl) {
    const btn = h('button', { class: 'lh-btn lh-btn--primary lh-btn--wide', onClick: () => advance() }, label);
    host.appendChild(btn);
    requestAnimationFrame(() => btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
    return btn;
  }

  const ctx = {
    caseDef, patient,
    stage, scene, overlay, panel, bodyEl, promptEl, patientWrap, patientEl,
    say, clearBubbles, setMood: setPatientMood, react, hotspot, award, teach,
    setPrompt, speakOptions, noteMistake, continueButton, fill: (t) => fill(t, patient),
    little: isLittle(),
    patientSound: patientSound(patient),
    next: () => advance(),
  };

  /* --- tally chips ------------------------------------------------------ */
  const tallyEl = h('div', { class: 'case-tally' });
  function renderTally() {
    tallyEl.innerHTML =
      `<span class="lh-chip lh-chip--tiny"><span class="lh-chip__icon">⭐</span>${tally.stars}</span>` +
      `<span class="lh-chip lh-chip--tiny"><span class="lh-chip__icon">❤️</span>${tally.kindness}</span>`;
    tallyEl.querySelectorAll('.lh-chip').forEach((c) => {
      c.classList.remove('is-bumping'); void c.offsetWidth; c.classList.add('is-bumping');
    });
  }
  renderTally();
  stage.appendChild(tallyEl);

  /* --- step machine ----------------------------------------------------- */
  function markDots() {
    [...dots.children].forEach((d, i) => {
      d.classList.toggle('done', i < index);
      d.classList.toggle('now', i === index);
    });
  }

  async function runStep() {
    if (destroyed) return;
    markDots();
    clear(bodyEl);
    teach(null);
    const step = caseDef.steps[index];
    if (!step) return finish();

    const runner = STEP_RUNNERS[step.type];
    if (!runner) {
      console.warn(`[caseRunner] unknown step type "${step.type}" — skipping`);
      return advance();
    }
    cleanupStep = await runner(step, ctx);
  }

  function advance() {
    try { cleanupStep?.(); } catch (e) { console.error(e); }
    cleanupStep = null;
    // Tapping Next means "I am done listening to this" — drop the rest of the
    // queue so the new step is not read out behind the old one.
    stopSpeaking();
    index++;
    runStep();
  }

  async function finish() {
    markDots();
    clear(bodyEl);
    clearBubbles();
    setPrompt(null);

    // The outro moment: the patient's happy reaction.
    const outro = caseDef.outro || {};
    if (outro.mood) setPatientMood(outro.mood);
    react(outro.react || 'happy');
    play(ctx.patientSound);
    if (outro.text) say('patient', outro.text, { translate: outro.translate });

    confetti({ intensity: 1.4 });
    sparkle(patientWrap, { count: 22 });
    sfx.fanfare();
    flash('rgba(255,255,255,.5)', 500);

    // Let the patient's last line land. A flat delay used to cut the outro off
    // mid-word and whip the screen away before a child had read — or heard —
    // what their patient just said. Wait for the voice to finish, with a floor
    // so the moment still registers when the voice is switched off entirely.
    await Promise.all([wait(2200), speechDone()]);
    if (destroyed) return;

    onFinish?.({
      caseDef, patient,
      stars: tally.stars + caseDef.reward.stars,
      stepStars: tally.stars,
      bonusStars: caseDef.reward.stars,
      kindness: tally.kindness,
      coins: caseDef.reward.coins + tally.coins,
      mistakes: tally.mistakes,
      badges: tally.badges,
      perfect: tally.mistakes === 0,
    });
  }

  /* Collect badges awarded by individual steps. */
  ctx.badge = (id) => { if (id && !tally.badges.includes(id)) tally.badges.push(id); };

  /* Little Helper mode gets a gentle voice-over style hint if a step stalls. */
  ctx.toast = toast;

  runStep();

  return {
    el,
    destroy() {
      destroyed = true;
      stopSpeaking();
      try { cleanupStep?.(); } catch { /* ignore */ }
    },
    quit: () => onQuit?.(),
  };
}
  Object.assign(__x, { createCaseRunner });
});

const { h } = __req("src/core/dom.js");

 *
 * This is the signature interaction of the game, so it is the most forgiving:
 * huge hotspots, drag OR two taps, the right tool glows in Little Helper mode,
 * and picking the wrong tool just gets a friendly "not that one!".

const { h, wait } = __req("src/core/dom.js");
const { sfx, play } = __req("src/core/audio.js");
const { sparkle, toast } = __req("src/core/fx.js");
const { getTool } = __req("src/data/tools.js");
const { makeDraggable, holdGauge, rubGauge } = __req("src/engine/interactions.js");

  if (step.mood) ctx.setMood(step.mood);

     whole patient rather than leaving a child with nowhere to drop the tool. */
  let spot = ctx.hotspot(step.target);
  if (!spot) {
    console.warn(`[tool] "${step.target}" is not a hotspot on this patient — using the whole patient instead`);
    spot = ctx.patientEl.querySelector('[data-spot="chest"]') || ctx.patientWrap;
  }
  const marker = h('div', { class: 'spot-marker' },
    h('div', { class: 'spot-marker__ring' }),
    h('div', { class: 'spot-marker__dot' }, tool.icon));
  ctx.overlay.appendChild(marker);
  const positionMarker = () => {
    // Changing the patient's mood re-renders the SVG, so the old hotspot node
    // can be detached by the time a resize fires.
    if (!spot.isConnected) return;
    const s = spot.getBoundingClientRect();
    const o = ctx.overlay.getBoundingClientRect();
    marker.style.left = `${s.left + s.width / 2 - o.left}px`;
    marker.style.top = `${s.top + s.height / 2 - o.top}px`;

  const onResize = () => positionMarker();

     readout card — and the marker was placed against the taller stage, so the

  let solved = false;
  let tries = 0;

  trayTools.forEach((id) => {
    const t = getTool(id);
    if (!t) return;
    const chip = h('button', {
      class: 'tool' + (id === step.tool ? ' tool--needed' : ''),
      dataset: { icon: t.icon, tool: id },
      style: { '--tool-tint': t.tint },
      title: t.name,
    }, h('span', { class: 'tool__icon' }, t.icon), h('span', { class: 'tool__name' }, t.name));

    // Little Helper mode literally points at the right tool.
    if (ctx.little && id === step.tool) chip.classList.add('tool--glow');

    cleaners.push(makeDraggable(chip, {
      layer: document.getElementById('fx'),
      getTargets: () => [{ el: spot, name: step.target }],
      onDrop: () => onDrop(id, chip),

  const idleTimer = setTimeout(() => {
    if (!solved) {

      setTimeout(() => chip.classList.remove('tool--shake'), 500);

    clearTimeout(idleTimer);

    sfx.drop();

    stuck.style.left = marker.style.left;
    stuck.style.top = marker.style.top;

        label: ctx.little ? 'Swipe side to side!' : 'Gently, back and forth…',
        onStroke: () => { sparkle(stuck, { count: 4, glyphs: ['✨', '🫧'] }); play('whoosh'); },

    ctx.react(step.reaction?.react || 'wiggle');
    if (step.reaction?.sfx) play(step.reaction.sfx);

    if (step.readout) {
      const card = readout(step.readout, tool, ctx);
      ctx.bodyEl.appendChild(card);
      requestAnimationFrame(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));

      ctx.say('narrator', readoutLine(step.readout, tool, ctx));

    if (step.reaction?.say) {
      ctx.say('patient', step.reaction.say, { translate: step.reaction.translate });
    }
    ctx.teach(step.teach || null);

  function stuckOrMarker() { return ctx.overlay.querySelector('.tool-stuck') || ctx.patientWrap; }

  return () => {
    clearTimeout(idleTimer);

    cleaners.forEach((c) => c());
    marker.remove();

function readoutLine(spec, tool, ctx) {
  const label = spec.label || tool.readout?.label || tool.name;
  const value = spec.kind === 'number' || spec.kind === 'heartbeat'
    ? `${spec.value}${spec.unit ? ` ${spec.unit}` : ''}`
    : ctx.fill(spec.value || '');

  const out = [...new Set(list)];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;

__def("src/engine/interactions.js", function (__x, __req) {
/**
 * Low-level child-friendly input helpers.
 *
 * Everything here is Pointer Events, so mouse / touch / pen behave the same.
 * The guiding rule: nothing should ever need precision. Targets are huge,
 * drags are forgiving, and every drag also works as two taps.
 */
const { h } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");

const HIT_PADDING = 26; // makes every hotspot much bigger than it looks

/**
 * Make a tool chip draggable onto one of several hotspots.
 * Also supports tap-the-tool → tap-the-patient, which younger children
 * find far easier than a sustained drag.
 */
function makeDraggable(chip, { getTargets, onPick, onDrop, onCancel, layer }) {
  let ghost = null;
  let armed = false;
  let startX = 0, startY = 0, moved = false;
  let activeTarget = null;

  const targetsNow = () => getTargets() || [];

  function makeGhost(x, y) {
    ghost = h('div', { class: 'tool-ghost' }, chip.dataset.icon || '🔧');
    (layer || document.body).appendChild(ghost);
    moveGhost(x, y);
  }

  function moveGhost(x, y) {
    if (!ghost) return;
    ghost.style.left = `${x}px`;
    ghost.style.top = `${y}px`;
  }

  function hitTest(x, y) {
    for (const t of targetsNow()) {
      const r = t.el.getBoundingClientRect();
      if (x >= r.left - HIT_PADDING && x <= r.right + HIT_PADDING &&
          y >= r.top - HIT_PADDING && y <= r.bottom + HIT_PADDING) return t;
    }
    return null;
  }

  function highlight(target) {
    if (activeTarget === target) return;
    activeTarget?.el.classList.remove('spot--over');
    activeTarget = target;
    activeTarget?.el.classList.add('spot--over');
  }

  function cleanup() {
    ghost?.remove();
    ghost = null;
    highlight(null);
    chip.classList.remove('tool--dragging');
  }

  function disarm() {
    armed = false;
    chip.classList.remove('tool--armed');
    document.removeEventListener('pointerdown', armedTap, true);
    cleanup();
    onCancel?.();
  }

  function armedTap(ev) {
    const target = hitTest(ev.clientX, ev.clientY);
    if (target) {
      ev.preventDefault();
      ev.stopPropagation();
      armed = false;
      chip.classList.remove('tool--armed');
      document.removeEventListener('pointerdown', armedTap, true);
      cleanup();
      onDrop(target, ev);
    } else if (!chip.contains(ev.target)) {
      disarm();
    }
  }

  function onPointerDown(ev) {
    if (chip.dataset.disabled === 'true') return;
    if (armed) { disarm(); return; }
    ev.preventDefault();
    chip.setPointerCapture?.(ev.pointerId);
    startX = ev.clientX; startY = ev.clientY; moved = false;
    chip.classList.add('tool--dragging');
    makeGhost(ev.clientX, ev.clientY);
    sfx.pickup();
    onPick?.();
    chip.addEventListener('pointermove', onPointerMove);
    chip.addEventListener('pointerup', onPointerUp);
    chip.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(ev) {
    if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) moved = true;
    moveGhost(ev.clientX, ev.clientY);
    highlight(hitTest(ev.clientX, ev.clientY));
  }

  function onPointerUp(ev) {
    chip.removeEventListener('pointermove', onPointerMove);
    chip.removeEventListener('pointerup', onPointerUp);
    chip.removeEventListener('pointercancel', onPointerUp);
    chip.releasePointerCapture?.(ev.pointerId);

    const target = hitTest(ev.clientX, ev.clientY);
    if (target) {
      cleanup();
      onDrop(target, ev);
      return;
    }

    if (!moved) {
      // A tap: arm the tool and wait for a tap on the patient.
      armed = true;
      chip.classList.add('tool--armed');
      cleanup();
      setTimeout(() => document.addEventListener('pointerdown', armedTap, true), 0);
      return;
    }

    cleanup();
    onCancel?.();
  }

  chip.addEventListener('pointerdown', onPointerDown);

  return () => {
    chip.removeEventListener('pointerdown', onPointerDown);
    document.removeEventListener('pointerdown', armedTap, true);
    cleanup();
  };

/**
 * Press-and-hold gauge. Progress is kept if the child lets go, so nobody has
 * to start over — releasing just pauses.

function holdGauge(host, { ms = 1500, label = 'Hold still…', icon = '🩺', onDone }) {
  const ring = h('div', { class: 'gauge gauge--hold' },
    h('div', { class: 'gauge__icon' }, icon),
    h('svg', { class: 'gauge__ring', viewBox: '0 0 100 100', html:
      `<circle cx="50" cy="50" r="43" class="gauge__track"/>
       <circle cx="50" cy="50" r="43" class="gauge__fill"/>` }),
    h('div', { class: 'gauge__label' }, label));
  host.appendChild(ring);

  const fill = ring.querySelector('.gauge__fill');
  const LEN = 2 * Math.PI * 43;
  fill.style.strokeDasharray = LEN;
  fill.style.strokeDashoffset = LEN;

  let progress = 0, last = 0, raf = 0, holding = false, done = false;

  const tick = (t) => {
    if (done) return;
    if (last) {
      const dt = t - last;
      progress = Math.max(0, Math.min(1, progress + (holding ? dt / ms : -dt / (ms * 2.5))));
      fill.style.strokeDashoffset = LEN * (1 - progress);
      if (progress >= 1) {
        done = true;
        ring.classList.add('gauge--done');
        setTimeout(() => { ring.remove(); onDone?.(); }, 260);
        return;
      }
    }
    last = t;
    raf = requestAnimationFrame(tick);
  };

  const start = (ev) => { ev.preventDefault(); holding = true; ring.classList.add('gauge--pressing'); };
  const stop = () => { holding = false; ring.classList.remove('gauge--pressing'); };

  ring.addEventListener('pointerdown', start);
  document.addEventListener('pointerup', stop);
  document.addEventListener('pointercancel', stop);
  raf = requestAnimationFrame(tick);

  return () => {
    done = true;
    cancelAnimationFrame(raf);
    document.removeEventListener('pointerup', stop);
    document.removeEventListener('pointercancel', stop);
    ring.remove();
  };
}

/**
 * Swipe-back-and-forth gauge (cleaning, combing, wrapping).
 * Counts direction changes rather than distance, so a small wiggly finger
 * works just as well as a big confident swipe.
 */
function rubGauge(host, { strokes = 6, label = 'Rub gently!', icon = '🧼', onStroke, onDone }) {
  const pad = h('div', { class: 'gauge gauge--rub' },
    h('div', { class: 'gauge__icon gauge__icon--rub' }, icon),
    h('div', { class: 'gauge__label' }, label),
    h('div', { class: 'gauge__pips' }, ...Array.from({ length: strokes }, () => h('i'))));
  host.appendChild(pad);

  const pips = [...pad.querySelectorAll('.gauge__pips i')];
  const glyph = pad.querySelector('.gauge__icon--rub');
  let count = 0, dir = 0, lastX = null, travel = 0, active = false, done = false;

  const down = (ev) => { active = true; lastX = ev.clientX; ev.preventDefault(); };
  const up = () => { active = false; lastX = null; };

    const dx = ev.clientX - lastX;

__def("src/engine/steps/readout.js", function (__x, __req) {
/**
 * The little result panel a tool shows after it is used — the "payoff" moment.
 * Each `readout.kind` gets its own animated presentation.
 */
const { h } = __req("src/core/dom.js");

function readout(spec, tool, ctx) {
  const card = h('div', { class: 'readout', style: { '--tint': tool.tint } });
  const head = h('div', { class: 'readout__head' },
    h('span', { class: 'readout__icon' }, tool.icon),
    h('span', {}, spec.label || tool.readout?.label || tool.name));
  card.appendChild(head);

  switch (spec.kind) {
    case 'heartbeat':
      card.appendChild(h('div', { class: 'readout__ecg', html: ecgSvg() }));
      card.appendChild(bigValue(spec));
      break;
    case 'number':
      card.appendChild(bigValue(spec));
      break;
    case 'ecg':
      card.appendChild(h('div', { class: 'readout__ecg', html: ecgSvg() }));
      break;
    default:
      card.appendChild(h('div', { class: 'readout__text' }, ctx.fill(spec.value)));
  }

  if (spec.text) card.appendChild(h('div', { class: 'readout__note' }, ctx.fill(spec.text)));
  return card;
}

function bigValue(spec) {
  const wrap = h('div', { class: 'readout__value' });
  const num = h('span', { class: 'readout__num' }, '0');
  wrap.appendChild(num);
  if (spec.unit) wrap.appendChild(h('span', { class: 'readout__unit' }, spec.unit));

  // Count up to the value — small, cheap, and very satisfying.
  const target = parseFloat(spec.value);
  if (Number.isNaN(target)) { num.textContent = spec.value; return wrap; }
  const decimals = (String(spec.value).split('.')[1] || '').length;
  const start = performance.now();
  const dur = 900;
  const tick = (t) => {
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    num.textContent = (target * eased).toFixed(decimals);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return wrap;
}

    <path d="M 0 34 H 40 l 8 -22 l 10 44 l 8 -22 H 120 l 8 -22 l 10 44 l 8 -22 H 240"
      fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"

    </path>
  </svg>`;

__def("src/engine/steps/choose.js", function (__x, __req) {
/**
 * `choose` — pick the right answer.
 *
 * Wrong picks are never punished: the card gently wobbles, a warm nudge
 * appears, and after two tries the correct card starts glowing so nobody can
 * get stuck. Little Helper mode only ever shows two options.
 */
const { h, wait, shuffle } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");
const { toast, sparkle } = __req("src/core/fx.js");
const { nudge, praise, TRIES_BEFORE_REVEAL } = __req("src/engine/hints.js");

function runChoose(step, ctx) {
  ctx.setPrompt(step.prompt, ctx.little ? null : step.subPrompt);
  if (step.mood) ctx.setMood(step.mood);

  const options = pickOptions(step.options, ctx.little);
  const layout = step.layout || 'cards';
  const grid = h('div', { class: `choice-grid choice-grid--${layout}` });

  let solved = false;
  let tries = 0;

  options.forEach((opt) => {
    const card = h('button', { class: `choice choice--${layout}`, onClick: () => choose(opt, card) },
      h('span', { class: 'choice__icon' }, opt.icon),
      layout === 'shapes' ? null : h('span', { class: 'choice__label' }, ctx.fill(opt.label)),
      !ctx.little && opt.detail ? h('span', { class: 'choice__detail' }, opt.detail) : null);
    if (layout === 'shapes') card.setAttribute('aria-label', opt.label);
    if (opt.correct) card.dataset.correct = 'true';
    grid.appendChild(card);
  });

  ctx.bodyEl.appendChild(grid);
  // Read the answers out after the question — otherwise a child who cannot
  // read is choosing between pictures with no idea what either one says.
  ctx.speakOptions(options.map((o) => o.label));

  const idle = setTimeout(() => {
    if (!solved && step.nudge) toast(ctx.fill(step.nudge), { icon: '💡' });
  }, ctx.little ? 6000 : 13000);

  async function choose(opt, card) {
    if (solved) return;

    if (!opt.correct) {
      tries++;
      ctx.noteMistake();
      sfx.nudge();
      card.classList.add('choice--wobble');
      setTimeout(() => card.classList.remove('choice--wobble'), 520);
      toast(ctx.fill(step.nudge || nudge()), { icon: '💡' });
      if (tries >= TRIES_BEFORE_REVEAL) grid.querySelector('[data-correct]')?.classList.add('choice--glow');
      return;
    }

    solved = true;
    clearTimeout(idle);
    grid.querySelectorAll('.choice').forEach((c) => {
      c.disabled = true;
      if (c !== card) c.classList.add('choice--dim');
    });
    card.classList.add('choice--right');
    sparkle(card, { count: 14 });
    sfx.great();

    ctx.award({ stars: step.stars ?? 1 }, card);
    if (step.badge) {
      ctx.badge(step.badge);
      toast('✨ New badge earned!', { icon: '🏅', tone: 'good' });
    }
    ctx.setPrompt(praise());
    if (opt.say) ctx.say('narrator', opt.say);
    else ctx.say('narrator', `Yes — ${ctx.fill(opt.label)}.`);
    ctx.react('happy');
    ctx.teach(step.teach || null);

    await wait(700);
    ctx.continueButton();
  }

  return () => clearTimeout(idle);
}

/**
 * Little Helper mode keeps the correct answer plus one distractor (preferring
 * one the author flagged `easy`), so a 4-year-old always faces a 50/50 choice.
 */
function pickOptions(all, little) {
  if (!little) return shuffle(all);
  const correct = all.find((o) => o.correct) || all[0];
  const others = all.filter((o) => o !== correct);
  const distractor = others.find((o) => o.easy) || others[0];
  return shuffle([correct, distractor].filter(Boolean));
}

});

const { praise } = __req("src/engine/hints.js");

/**
 * `scan` — the X-ray machine and the microscope.
 *
 * Two phases:
 *   1. line it up  (drag a frame over the body part, or twist a focus dial)
 *   2. fire it     (a big satisfying button, a whirr, a reveal)
 * then the child reads the picture and says what they can see.
 */
const { h, wait, shuffle } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");
const { sparkle, toast, flash } = __req("src/core/fx.js");
const { scanArt } = __req("src/engine/arts.js");
const { praise, nudge, TRIES_BEFORE_REVEAL } = __req("src/engine/hints.js");

function runScan(step, ctx) {
  const cleanups = [];
  ctx.setPrompt(step.prompt, ctx.little ? null : step.aimHint);

  const machine = h('div', { class: `scanner scanner--${step.mode}` });
  ctx.bodyEl.appendChild(machine);

  if (step.mode === 'micro') aimMicroscope(); else aimXray();

  /* ---------------------------------------------------------- aiming: X-ray */
  function aimXray() {
    const spot = ctx.hotspot(step.target || 'chest') || ctx.patientEl.querySelector('[data-spot="chest"]');
    const frame = h('div', { class: 'xray-frame' },
      h('div', { class: 'xray-frame__corner tl' }), h('div', { class: 'xray-frame__corner tr' }),
      h('div', { class: 'xray-frame__corner bl' }), h('div', { class: 'xray-frame__corner br' }),
      h('div', { class: 'xray-frame__hint' }, '🩻'));

    // Show the child exactly where the camera needs to end up.
    const marker = h('div', { class: 'spot-marker' },
      h('div', { class: 'spot-marker__ring' }), h('div', { class: 'spot-marker__dot' }, '🎯'));
    const placeMarker = () => {
      if (!spot) return;
      const s = spot.getBoundingClientRect();
      const o = ctx.overlay.getBoundingClientRect();
      marker.style.left = `${s.left + s.width / 2 - o.left}px`;
      marker.style.top = `${s.top + s.height / 2 - o.top}px`;
    };
    ctx.overlay.append(marker, frame);
    placeMarker();
    window.addEventListener('resize', placeMarker);
    // Same as the tool step: the panel grows under the stage, so the target
    // has to be re-placed rather than measured once and left behind.
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(placeMarker) : null;
    ro?.observe(ctx.overlay);
    cleanups.push(() => {
      ro?.disconnect();
      window.removeEventListener('resize', placeMarker);
      marker.remove();
    });

    // Start away from the target — but low, clear of the speech bubbles.
    let pos = { x: 20, y: 66 };
    const apply = () => { frame.style.left = `${pos.x}%`; frame.style.top = `${pos.y}%`; };
    apply();

    let dragging = false;
    const rectOf = () => ctx.overlay.getBoundingClientRect();

    const down = (ev) => { dragging = true; frame.setPointerCapture?.(ev.pointerId); ev.preventDefault(); sfx.pickup(); };
    const move = (ev) => {
      if (!dragging) return;
      const r = rectOf();
      pos = { x: ((ev.clientX - r.left) / r.width) * 100, y: ((ev.clientY - r.top) / r.height) * 100 };
      apply();
      frame.classList.toggle('xray-frame--locked', isOver());
    };
    const up = () => { dragging = false; if (isOver()) sfx.select(); };

    function isOver() {
      if (!spot) return true;
      const s = spot.getBoundingClientRect();
      const f = frame.getBoundingClientRect();
      return Math.hypot((f.left + f.width / 2) - (s.left + s.width / 2),
                        (f.top + f.height / 2) - (s.top + s.height / 2)) < 90;
    }

    frame.addEventListener('pointerdown', down);
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);

    const fire = h('button', { class: 'lh-btn lh-btn--toy lh-btn--wide scan-fire', onClick: () => {
      if (!isOver()) { toast('Line the camera up with the glowing spot first!', { icon: '🎯' }); return; }
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      frame.classList.add('xray-frame--firing');
      marker.remove();
      shoot(() => frame.remove());
    } }, '🩻 TAKE THE PICTURE');
    machine.appendChild(fire);

      document.removeEventListener('pointerup', up);
      frame.remove();
    });

    const dial = h('input', { class: 'micro-dial', type: 'range', min: '0', max: '100', value: '4', 'aria-label': 'Focus dial' });
    const blur = view.querySelector('.micro-blur');

    const onInput = () => {
      const v = Number(dial.value);
      // Sharpest at 72 — the child hunts for the sweet spot.
      const off = Math.abs(v - 72) / 72;
      blur.style.filter = `blur(${(off * 14).toFixed(1)}px)`;
      blur.style.opacity = String(0.55 + (1 - off) * 0.45);

      fire.textContent = sharp ? '🔬 LOOK CLOSER!' : 'Keep twisting the dial…';
    };

    const fire = h('button', { class: 'lh-btn lh-btn--primary lh-btn--wide scan-fire', onClick: () => shoot(() => {}) }, 'Keep twisting the dial…');
    machine.appendChild(view);
    machine.appendChild(h('div', { class: 'micro-dial-wrap' },
      h('span', {}, '🔎'), dial, h('span', {}, '🔬')));
    machine.appendChild(fire);
    onInput();
  }

    machine.innerHTML = '';

      h('div', { class: 'scan-loading__bar' }, h('i')),
      h('div', {}, step.mode === 'micro' ? '🔬 zooming in…' : '🩻 taking the picture…')));

    await wait(1200);
    cleanupAim();
    flash('rgba(180,225,255,.7)', 420);
    machine.innerHTML = '';

    const plate = h('div', { class: `scan-plate scan-plate--${step.mode}`, html: scanArt(step.revealArt) });
    machine.appendChild(plate);
    machine.appendChild(h('div', { class: 'scan-caption' }, ctx.fill(step.revealCaption || 'Look at that!')));
    ctx.say('narrator', step.revealCaption || 'Look at that!');
    sparkle(plate, { count: 12, glyphs: ['✨', '💫'] });

    await wait(700);
    askFinding();
  }

  function askFinding() {
    ctx.setPrompt('What can you see?');
    const options = ctx.little ? littleOptions(step.findings) : shuffle(step.findings);
    const row = h('div', { class: 'choice-grid choice-grid--chips' });
    let tries = 0, solved = false;

    options.forEach((opt) => {
      const card = h('button', { class: 'choice choice--chips', onClick: () => pickFinding(opt, card) },
        h('span', { class: 'choice__icon' }, opt.icon),
        h('span', { class: 'choice__label' }, ctx.fill(opt.label)));
      if (opt.correct) card.dataset.correct = 'true';
      row.appendChild(card);
    });
    machine.appendChild(row);
    ctx.speakOptions(options.map((o) => o.label), { lead: 'Is it:' });

      if (solved) return;
      if (!opt.correct) {
        tries++;
        ctx.noteMistake();
        sfx.nudge();
        card.classList.add('choice--wobble');
        setTimeout(() => card.classList.remove('choice--wobble'), 520);
        toast(ctx.fill(step.nudge || nudge()), { icon: '🔍' });
        if (tries >= TRIES_BEFORE_REVEAL) row.querySelector('[data-correct]')?.classList.add('choice--glow');
        return;
      }
      solved = true;
      row.querySelectorAll('.choice').forEach((c) => { c.disabled = true; if (c !== card) c.classList.add('choice--dim'); });
      card.classList.add('choice--right');
      sfx.great();
      sparkle(card, { count: 16 });
      ctx.award({ stars: step.stars ?? 2 }, card);
      ctx.setPrompt(praise());
      if (opt.say) ctx.say('narrator', opt.say);
      else ctx.say('narrator', `You found it — ${ctx.fill(opt.label)}.`);

    const correct = all.find((o) => o.correct) || all[0];
    const other = all.filter((o) => o !== correct).find((o) => o.easy) || all.find((o) => o !== correct);
    return shuffle([correct, other].filter(Boolean));

__def("src/engine/steps/show.js", function (__x, __req) {
/**
 * `show` — a small illustrated explainer between the hands-on bits.
 *
 * Deliberately short and always optional to read: the animation carries the
 * idea, the words are a bonus.
 */
const { h } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");
const { showArt } = __req("src/engine/arts.js");

function runShow(step, ctx) {
  ctx.setPrompt(null);

  const panel = h('div', { class: 'showcard' },
    h('div', { class: 'showcard__art', html: showArt(step.art) }),
    h('h3', { class: 'showcard__title' }, ctx.fill(step.title)),
    h('p', { class: 'showcard__text' }, ctx.fill(step.text)));
  ctx.bodyEl.appendChild(panel);
  // The explainer is pure text on screen; without this it is silent to a
  // child who cannot read, which is precisely who it is written for.
  ctx.say('narrator', `${ctx.fill(step.title)}. ${ctx.fill(step.text)}`);
  sfx.select();

  ctx.bodyEl.appendChild(h('button', {
    class: 'lh-btn lh-btn--secondary lh-btn--wide', onClick: () => { sfx.tap(); ctx.next(); },
  }, step.cta || 'Got it! 👍'));
}
  Object.assign(__x, { runShow });
});

  const el = h('div', { class: 'lh-screen lh-screen--bag', 'data-world': 'doctor' });
  const bar = hud({ title: '🎒 My Doctor Bag', back: () => goHome('hub'), dark: true, chips: ['stars', 'kindness'] });
  el.appendChild(bar);

  const scroll = h('div', { class: 'lh-screen__scroll' });
  const owned = TOOL_ORDER.filter(hasTool).length;

  scroll.appendChild(sectionTitle('🩺', 'My equipment', 'Every tool you have collected so far.'));
  scroll.appendChild(h('div', { style: { display: 'grid', placeItems: 'center', padding: '0 16px 12px' } },
    progressBar(owned, TOOL_ORDER.length, 'Collection')));

    const got = hasTool(id);

      h('span', { class: 'kit__name' }, got ? tool.name : '???'),

/**
 * The Supply Room.
 *
 * Everything here changes something the child can see: decorations appear in
 * the hospital rooms, outfits appear on the hero, and the one big-ticket item
 * physically builds a new wing.
 */
const { h, clear } = __req("src/core/dom.js");
const { sfx } = __req("src/core/audio.js");
const { goHome, go } = __req("src/core/router.js");
const { getState, buyItem, ownsItem } = __req("src/core/state.js");
const { CATEGORIES, itemsIn } = __req("src/data/shop.js");
const { hud, sectionTitle } = __req("src/ui/components.js");
const { confetti, sparkle, toast } = __req("src/core/fx.js");

function shopScreen({ category = 'comfort' } = {}) {
  let active = category;

  const el = h('div', { class: 'lh-screen lh-screen--shop', 'data-world': 'doctor' });
  const bar = hud({ title: '🛒 Supply Room', back: () => goHome('hub'), dark: true, chips: ['coins'] });
  el.appendChild(bar);

  const scroll = h('div', { class: 'lh-screen__scroll' });
  scroll.appendChild(sectionTitle('📦', 'Spend your coins', 'Everything you buy shows up in your hospital!'));

  const tabs = h('div', { class: 'shop-tabs' });
  const grid = h('div', { class: 'lh-card-grid' });
  scroll.append(tabs, grid);
  el.appendChild(scroll);

  function renderTabs() {
    clear(tabs);
    CATEGORIES.forEach((cat) => {
      tabs.appendChild(h('button', {
        class: 'shop-tab',
        role: 'tab',
        'aria-selected': String(cat.id === active),
        onClick: () => { active = cat.id; sfx.tap(); render(); },
      }, h('span', {}, cat.icon), h('span', {}, cat.name)));
    });
  }

  function render() {
    renderTabs();
    clear(grid);
    const coins = getState().wallet.coins;
    const items = itemsIn(active);

    if (!items.length) {
      grid.appendChild(h('p', { class: 'empty-note' }, 'Nothing here yet — check back soon!'));
      return;
    }

    items.forEach((item) => {
      const owned = ownsItem(item.id);
      const affordable = coins >= item.price;
      const card = h('button', {
        class: `kit buy${owned ? ' buy--owned' : ''}${!owned && !affordable ? ' buy--poor' : ''}`,
        onClick: () => buy(item, card),
      },
        h('span', { class: 'kit__icon' }, item.icon),
        h('span', { class: 'kit__name' }, item.name),
        h('span', { class: 'kit__blurb' }, item.blurb),
        h('span', { class: 'buy__price' }, owned ? '✅ Bought!' : `🪙 ${item.price}`));
      grid.appendChild(card);
    });
  }

  function buy(item, card) {
    const result = buyItem(item);
    if (result === 'owned') {
      sfx.tap();
      toast('You already own this one!', { icon: '✅', tone: 'good' });
      return;
    }
    if (result === 'poor') {
      sfx.nudge();
      toast(`You need ${item.price - getState().wallet.coins} more coins — help another patient!`, { icon: '🪙' });
      return;
    }

    sfx.unlock();
    sparkle(card, { count: 16 });
    confetti({ intensity: 0.6, duration: 1800 });

    if (item.unlocksRoom) {
      toast('A new room is being built!', { icon: '🏗️', tone: 'good', ms: 3000 });
      setTimeout(() => go('hub', { build: [item.unlocksRoom] }, { replace: true }), 900);
      return;
    }
    if (item.accessory) {
      toast('Try it on in the character creator! 🎨', { icon: '👕', tone: 'good', ms: 3000 });
    } else {
      toast('It has been added to your hospital!', { icon: '🏥', tone: 'good' });
    }
    render();
  }

  render();
  return { el, destroy: () => bar.dispose?.() };
}
  Object.assign(__x, { shopScreen });
